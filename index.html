<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entre Pollos & Empanadas — POS Mostrador</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: PIN login -> header + horizontal tabs -> content area per tab.
   Mostrador splits into a product grid and an order panel (sidebar on wide
   screens, a bottom sheet on narrow ones). */
:root{
  --bg:#141414; --bg-elev:#1c1c1c; --surface:#202020; --surface-2:#2a2a2a;
  --border:rgba(255,255,255,.14); --fg:#f5f1e8; --fg-dim:#c7c1b6; --muted:#8f8a82;
  --accent:#e2272d; --accent-fg:#ffffff; --accent-2:#f2a71b;
  --success:#5fae6b; --success-fg:#0d1f10; --danger:#a8342c; --danger-fg:#ffffff;
  color-scheme:dark;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#fbf6ee; --bg-elev:#ffffff; --surface:#ffffff; --surface-2:#f2e6d6;
    --border:rgba(20,12,8,.14); --fg:#1d1613; --fg-dim:#4a3a2d; --muted:#7a6a5a;
    --accent:#d41f26; --accent-fg:#ffffff; --accent-2:#c9821f;
    --success:#2f7a3b; --success-fg:#ffffff; --danger:#a8342c; --danger-fg:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#fbf6ee; --bg-elev:#ffffff; --surface:#ffffff; --surface-2:#f2e6d6;
  --border:rgba(20,12,8,.14); --fg:#1d1613; --fg-dim:#4a3a2d; --muted:#7a6a5a;
  --accent:#d41f26; --accent-fg:#ffffff; --accent-2:#c9821f;
  --success:#2f7a3b; --success-fg:#ffffff; --danger:#a8342c; --danger-fg:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); margin:0;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  font-size:15px; line-height:1.4;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:600; text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
#app{min-height:100%; display:flex; flex-direction:column; max-width:1180px; margin:0 auto; padding-bottom:24px}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size:15px; color:var(--fg); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
label{font-size:13px; color:var(--fg-dim); display:block; margin-bottom:5px; font-weight:500}
.field{margin-bottom:14px}
.row-split{display:flex; gap:12px}
.row-split>.field{flex:1}

/* ---------- buttons ---------- */
.btn{border:1px solid transparent; border-radius:9px; padding:11px 18px; font-size:14.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .08s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn-primary{background:var(--accent); color:var(--accent-fg)}
.btn-secondary{background:var(--surface-2); color:var(--fg); border-color:var(--border)}
.btn-danger{background:var(--danger); color:var(--danger-fg)}
.btn-ghost{background:transparent; color:var(--fg-dim); border-color:var(--border)}
.btn-block{width:100%}
.btn-icon{background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:8px; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; padding:0; flex-shrink:0}
.icon{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; display:block}
.icon-sm{width:15px; height:15px}

/* ---------- top bar + nav ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0 10px}
.brand{display:flex; align-items:center; gap:8px; min-width:0}
.brand-text{min-width:0}
.brand-name{font-size:18px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-sub{font-size:12px; color:var(--muted); margin:0}
.session{display:flex; align-items:center; gap:10px; flex-shrink:0}
.user-chip{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25}
.user-chip .uname{font-size:13.5px; font-weight:600}
.badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:999px; display:inline-block}
.badge-admin{background:rgba(232,163,61,.18); color:var(--accent)}
.badge-cajero{background:var(--surface-2); color:var(--muted)}
.badge-completado{background:rgba(111,174,118,.18); color:var(--success)}
.badge-anulado{background:rgba(209,84,58,.18); color:var(--danger)}

.tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:10px; margin-bottom:16px; border-bottom:1px solid var(--border)}
.tab-btn{display:flex; align-items:center; gap:7px; background:transparent; border:none; color:var(--muted); padding:9px 13px; border-radius:8px 8px 0 0; font-size:13.5px; font-weight:600; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--surface)}

.content{flex:1}
.empty-state{text-align:center; padding:48px 20px; color:var(--muted)}
.empty-state .icon{width:30px; height:30px; margin:0 auto 12px; opacity:.6}
.loading-block{display:flex; align-items:center; justify-content:center; gap:10px; padding:50px 20px; color:var(--muted); font-size:14px}
.spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2s}}

/* ---------- login ---------- */
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 0; min-height:70vh}
.login-card{width:100%; max-width:320px; text-align:center}
.logo-login{width:124px; height:124px; object-fit:contain; display:block; margin:0 auto 10px}
.logo-header{width:38px; height:38px; object-fit:contain; border-radius:50%; flex-shrink:0}
.login-card .brand-name{font-size:24px; display:block; margin-bottom:2px}
.login-card .brand-sub{margin-bottom:28px}
.pin-label{font-size:13px; color:var(--fg-dim); margin-bottom:14px}
.pin-dots{display:flex; justify-content:center; gap:14px; margin-bottom:26px}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); transition:background .12s, border-color .12s}
.pin-dot.filled{background:var(--accent); border-color:var(--accent)}
.pin-dots.error .pin-dot{border-color:var(--danger); background:var(--danger)}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.key-btn{background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--fg); font-size:19px; font-weight:600; padding:0; height:58px; display:flex; align-items:center; justify-content:center}
.key-btn:active{background:var(--surface-2)}
.key-btn.key-sub{font-size:13px; color:var(--muted)}
.login-hint{margin-top:18px; font-size:12.5px; color:var(--muted); min-height:16px}

/* ---------- mostrador ---------- */
.mostrador-grid{display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start}
.chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:12px}
.chip{padding:7px 15px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--fg-dim); white-space:nowrap}
.chip.active{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); gap:10px}
.product-card{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px; display:flex; flex-direction:column; gap:7px; min-height:84px; text-align:left}
.product-card:active{transform:scale(.97)}
.product-card .pname{font-size:14px; font-weight:600; line-height:1.25}
.product-card .pprice{font-size:14px; color:var(--accent); font-weight:700; margin-top:auto}

.cart-panel{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:16px; display:flex; flex-direction:column; gap:12px; position:sticky; top:16px; max-height:calc(100vh - 32px)}
.cart-header{display:flex; align-items:center; justify-content:space-between}
.cart-header h2{font-size:15px; margin:0}
.cart-count{font-size:12px; color:var(--muted)}
.cart-items{display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1; min-height:0}
.cart-line{display:flex; flex-direction:column; gap:6px; padding-bottom:10px; border-bottom:1px solid var(--border)}
.cart-line:last-child{border-bottom:none; padding-bottom:0}
.cart-line-top{display:flex; justify-content:space-between; gap:8px; font-size:13.5px}
.cart-line-name{font-weight:600; min-width:0}
.cart-line-total{font-weight:700; color:var(--accent); flex-shrink:0}
.cart-line-bottom{display:flex; align-items:center; justify-content:space-between}
.qty-stepper{display:flex; align-items:center; gap:9px}
.qty-stepper button{width:26px; height:26px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border); color:var(--fg); display:flex; align-items:center; justify-content:center; padding:0}
.qty-stepper .qty-val{font-size:14px; min-width:18px; text-align:center}
.cart-remove{background:transparent; border:none; color:var(--muted); padding:4px}
.cart-empty{color:var(--muted); font-size:13.5px; text-align:center; padding:20px 0}
.cart-totals{border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:4px}
.cart-total-row{display:flex; justify-content:space-between; font-size:19px; font-weight:700}

.cart-mobile{display:none}
@media (max-width:860px){
  .mostrador-grid{grid-template-columns:1fr}
  .cart-panel{display:none}
  .cart-mobile{display:block; position:fixed; left:0; right:0; bottom:0; z-index:40}
  .cart-bar{background:var(--accent); color:var(--accent-fg); display:flex; align-items:center; justify-content:space-between; padding:14px max(16px, env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-right,0px)); font-weight:700; font-size:14.5px; border:none; width:100%}
  .cart-sheet{background:var(--bg-elev); border-top:1px solid var(--border); border-radius:16px 16px 0 0; max-height:65vh; display:flex; flex-direction:column; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
  .cart-sheet[hidden]{display:none}
  .cart-sheet .cart-items{max-height:38vh}
}

/* ---------- productos / usuarios lists ---------- */
.list-toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 10px}
.section-title:first-child{margin-top:0}
.data-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px}
.data-row.inactive{opacity:.55}
.data-row-main{flex:1; min-width:0}
.data-row-title{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.data-row-sub{font-size:12.5px; color:var(--muted); margin-top:2px}
.data-row-actions{display:flex; gap:6px; flex-shrink:0}
.switch{width:38px; height:22px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex-shrink:0; padding:0}
.switch::after{content:''; position:absolute; top:1px; left:1px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform .15s, background .15s}
.switch.on{background:rgba(111,174,118,.25); border-color:var(--success)}
.switch.on::after{transform:translateX(16px); background:var(--success)}

/* ---------- stat tiles & reportes ---------- */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:22px}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:14px}
.stat-tile .stat-label{font-size:12px; color:var(--muted); margin-bottom:6px}
.stat-tile .stat-value{font-size:21px; font-weight:700}
.bar-row{display:grid; grid-template-columns:110px 1fr 90px; align-items:center; gap:10px; margin-bottom:9px; font-size:13px}
.bar-row .bar-label{color:var(--fg-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{height:9px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.bar-fill{height:100%; background:var(--accent); border-radius:999px}
.bar-value{text-align:right; font-weight:600}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px}
.panel h3{font-size:14px; margin:0 0 14px}

/* ---------- date filter ---------- */
.date-filter{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.date-filter input{width:auto}

/* ---------- modals ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,6,4,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:60}
.modal{background:var(--bg-elev); border:1px solid var(--border); border-radius:15px; max-width:420px; width:100%; max-height:88vh; overflow-y:auto; padding:22px}
.modal h2{font-size:17px; margin:0 0 16px}
.modal-actions{display:flex; gap:10px; margin-top:4px}
.modal-actions .btn{flex:1}
.modal-error{background:rgba(209,84,58,.15); color:var(--danger); border-radius:8px; padding:9px 11px; font-size:13px; margin-bottom:14px}

.pay-methods{display:flex; gap:8px; margin-bottom:18px}
.pay-btn{flex:1; flex-direction:column; padding:14px 6px; font-size:12.5px; gap:5px}
.pay-btn.selected{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.checkout-total{text-align:center; margin-bottom:20px}
.checkout-total .amount{font-size:32px; font-weight:700; display:block; font-family:'Space Grotesk',sans-serif}
.checkout-total .label{font-size:12.5px; color:var(--muted)}

.ticket{font-family:'Space Grotesk',sans-serif}
.ticket-head{text-align:center; margin-bottom:16px; padding-bottom:14px; border-bottom:1px dashed var(--border)}
.ticket-head .tnum-badge{display:inline-block; background:var(--accent); color:var(--accent-fg); font-weight:700; font-size:13px; padding:3px 11px; border-radius:999px; margin-top:8px}
.ticket-items{display:flex; flex-direction:column; gap:6px; margin-bottom:14px; font-size:13.5px; font-family:'Inter',sans-serif}
.ticket-item-row{display:flex; justify-content:space-between; gap:8px}
.ticket-item-row .ti-name{color:var(--fg-dim)}
.ticket-foot{border-top:1px dashed var(--border); padding-top:12px; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px}
.ticket-foot .amount{font-size:22px; font-weight:700}
.ticket-meta{font-size:12px; color:var(--muted); text-align:center; margin-top:-8px; margin-bottom:16px; font-family:'Inter',sans-serif}

.confirm-text{font-size:14px; color:var(--fg-dim); margin-bottom:18px}
.setup-warning{max-width:480px; margin:60px auto; background:var(--surface); border:1px solid var(--danger); border-radius:12px; padding:20px; text-align:center}

/* ---------- mesas ---------- */
.mesas-select{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; max-width:460px}
.mesa-card{background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:22px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:120px; text-align:center}
.mesa-card.free{border-color:var(--success)}
.mesa-card.occ{border-color:var(--accent); background:rgba(226,39,45,.08)}
.mesa-name{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700}
.mesa-status{font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.mesa-card.free .mesa-status{color:var(--success)}
.mesa-card.occ .mesa-status{color:var(--accent)}
.mesa-total{font-size:14px; font-weight:700; margin-top:4px}
.mesa-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px}
.mesa-head-info{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.mesa-head-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px}
.mesa-guests-field{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--fg-dim); margin:0}
.mesa-guests-field input{width:64px; padding:6px 8px}
.cart-line-note{font-size:12px; color:var(--muted); font-style:italic; margin-top:-2px}
.cart-note-btn{background:transparent; border:none; color:var(--muted); padding:4px}
.ticket-item-note{font-size:11.5px; color:var(--muted); font-style:italic; margin:-3px 0 4px}
.tip-label{font-size:12.5px; color:var(--fg-dim); margin-bottom:8px; font-weight:600}
.tip-methods{margin-bottom:10px}
.tip-custom-row{display:flex; align-items:center; gap:8px; margin:-2px 0 12px; font-size:13px; color:var(--fg-dim)}
.tip-custom-row input{width:100px}
.tip-amount-line{font-size:13px; color:var(--fg-dim); margin:-6px 0 14px; text-align:right}
</style>
</head>

  var state = {
    db: undefined,              // undefined=not resolved yet, null=unavailable, object=ready
    settings: {businessName:'Entre Pollos & Empanadas', subtitle:'Pollo a la brasa y empanadas al horno'},
    settingsLoaded:false,
    products: [], productsLoaded:false,
    orders: [], ordersLoaded:false,
    users: [], usersLoaded:false,
    currentUser: null,
    pinBuffer:'', pinError:false,
    activeTab:'mostrador',
    activeCategory:'all',
    cart: [],                   // {id,name,price,qty}
    cartExpanded:false,
    modal: null,                // {type, data}
    modalError:'',
    confirmBox: null,           // {text, action}
    ticket: null,
    ventasDate: todayStr(),
    pinVisible: {},
    mesas: [], mesasLoaded:false, mesasBootstrapped:false,
    activeMesa: null, mesaCategory:'all'
  };

  var TABS = [
    {id:'mostrador', label:'Mostrador', icon:'receipt', roles:['admin','cajero']},
    {id:'mesas', label:'Mesas', icon:'table', roles:['admin','cajero']},
    {id:'productos', label:'Productos', icon:'box', roles:['admin']},
    {id:'ventas', label:'Ventas', icon:'chart', roles:['admin','cajero']},
    {id:'reportes', label:'Reportes', icon:'clipboard', roles:['admin']},
    {id:'usuarios', label:'Usuarios', icon:'users', roles:['admin']}
  ];
  var DEFAULT_CATEGORIES = ['Pollo','Empanadas','Bebidas','Extras'];

  /* ---------------- helpers ---------------- */
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtCLP(n){ try{ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0); }catch(e){ return '$'+Math.round(n||0); } }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function dateStrOf(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtTime(iso){ var d=new Date(iso); if(isNaN(d)) return '--:--'; return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function fmtDateHuman(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+fmtTime(iso); }
  function paymentLabel(p){ return {efectivo:'Efectivo', tarjeta:'Tarjeta', transferencia:'Transferencia'}[p] || p || '—'; }
  function activeProducts(){ return state.products.filter(function(p){ return p.active!==false; }); }
  function categoriesFromProducts(){
    var seen = {}, out = [];
    activeProducts().forEach(function(p){ var c=p.category||'Otros'; if(!seen[c]){ seen[c]=true; out.push(c); } });
    return out.length ? out : DEFAULT_CATEGORIES;
  }
  function cartSubtotal(){ return state.cart.reduce(function(s,l){ return s+l.price*l.qty; }, 0); }
  function cartCount(){ return state.cart.reduce(function(s,l){ return s+l.qty; }, 0); }
  function can(role){ return state.currentUser && state.currentUser.role===role; }
  function isAdmin(){ return can('admin'); }

  /* ---------------- db wiring (Firebase Firestore) ---------------- */
  var unsub = {};
  function initDb(){
    var notConfigured = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('TU_')===0;
    if(notConfigured){
      document.getElementById('app').innerHTML =
        '<div class="setup-warning"><h2 style="margin-top:0">Falta configurar Firebase</h2>'+
        '<p style="color:var(--fg-dim); font-size:14px; line-height:1.6">Edita <code>index.html</code> y reemplaza el objeto <code>firebaseConfig</code> '+
        'con los datos de tu proyecto (Consola de Firebase → Configuración del proyecto → Tus apps). Revisa el README.md incluido para el paso a paso.</p></div>';
      return;
    }
    var db;
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }catch(e){
      document.getElementById('app').innerHTML =
        '<div class="setup-warning"><h2 style="margin-top:0">No se pudo conectar</h2>'+
        '<p style="color:var(--fg-dim); font-size:14px">Revisa que los datos de <code>firebaseConfig</code> sean correctos.</p></div>';
      return;
    }
    state.db = db;
    render();

    unsub.products = db.collection('products').onSnapshot(function(snap){
      state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.productsLoaded = true; render();
    }, function(){ state.productsLoaded = true; render(); });

    unsub.orders = db.collection('orders').orderBy('createdAt','desc').limit(400).onSnapshot(function(snap){
      state.orders = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.ordersLoaded = true; render();
    }, function(){ state.ordersLoaded = true; render(); });

    unsub.users = db.collection('users').onSnapshot(function(snap){
      state.users = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.usersLoaded = true; render();
    }, function(){ state.usersLoaded = true; render(); });

    unsub.settings = db.doc('settings/general').onSnapshot(function(snap){
      if(snap.exists){ state.settings = Object.assign({}, state.settings, snap.data()); }
      state.settingsLoaded = true; render();
    }, function(){ state.settingsLoaded = true; render(); });

    unsub.mesas = db.collection('mesas').onSnapshot(function(snap){
      state.mesas = snap.docs.map(function(d){ var m = Object.assign({id:d.id}, d.data()); if(!Array.isArray(m.items)) m.items=[]; return m; });
      state.mesasLoaded = true; render();
      ensureMesasBootstrap();
    }, function(){ state.mesasLoaded = true; render(); });
  }

  function ensureMesasBootstrap(){
    if(state.mesasBootstrapped || !state.db) return;
    state.mesasBootstrapped = true;
    if(state.mesas.length===0){
      var batch = state.db.batch();
      batch.set(state.db.collection('mesas').doc('mesa1'), {name:'Mesa 1', occupied:false, items:[], guests:null});
      batch.set(state.db.collection('mesas').doc('mesa2'), {name:'Mesa 2', occupied:false, items:[], guests:null});
      batch.commit().catch(function(){ state.mesasBootstrapped = false; });
    }
  }

  /* ---------------- actions ---------------- */
  async function pinKey(k){
    if(k==='clear'){ state.pinBuffer=''; state.pinError=false; render(); return; }
    if(k==='back'){ state.pinBuffer = state.pinBuffer.slice(0,-1); state.pinError=false; render(); return; }
    if(state.pinBuffer.length>=4) return;
    state.pinBuffer += k;
    state.pinError = false;
    render();
    if(state.pinBuffer.length===4){ await attemptLogin(); }
  }

  async function attemptLogin(){
    var pin = state.pinBuffer;
    if(!state.usersLoaded){
      // give the listener a brief moment to answer before bootstrapping
      await new Promise(function(r){ setTimeout(r, 500); });
    }
    var match = state.users.find(function(u){ return u.pin===pin; });
    if(match){
      state.currentUser = {id:match.id, name:match.name, role:match.role};
      state.pinBuffer=''; state.pinError=false;
      if(!TABS.some(function(t){ return t.id===state.activeTab && t.roles.indexOf(state.currentUser.role)>-1; })) state.activeTab='mostrador';
      render();
      return;
    }
    if(state.usersLoaded && state.users.length===0 && state.db){
      try{
        var ref = await state.db.collection('users').add({name:'Administrador', pin:pin, role:'admin', createdAt:new Date().toISOString()});
        state.currentUser = {id:ref.id, name:'Administrador', role:'admin'};
        state.pinBuffer=''; state.pinError=false; render();
        return;
      }catch(e){ /* fall through to error */ }
    }
    state.pinError = true;
    render();
    setTimeout(function(){ state.pinBuffer=''; state.pinError=false; render(); }, 650);
  }

  function logout(){ state.currentUser=null; state.cart=[]; state.cartExpanded=false; state.activeTab='mostrador'; render(); }

  function setTab(id){
    var t = TABS.find(function(x){ return x.id===id; });
    if(t && state.currentUser && t.roles.indexOf(state.currentUser.role)>-1){ state.activeTab=id; state.modal=null; }
    render();
  }

  function setCategory(cat){ state.activeCategory = cat; render(); }

  function addToCart(id){
    var p = state.products.find(function(x){ return x.id===id; });
    if(!p || p.active===false) return;
    var line = state.cart.find(function(l){ return l.id===id; });
    if(line) line.qty += 1;
    else state.cart.push({id:p.id, name:p.name, price:Number(p.price)||0, qty:1});
    render();
  }
  function cartInc(id){ var l=state.cart.find(function(x){return x.id===id;}); if(l){ l.qty+=1; render(); } }
  function cartDec(id){ var l=state.cart.find(function(x){return x.id===id;}); if(l){ l.qty-=1; if(l.qty<=0) state.cart=state.cart.filter(function(x){return x.id!==id;}); render(); } }
  function cartRemove(id){ state.cart = state.cart.filter(function(x){ return x.id!==id; }); render(); }
  function toggleCartSheet(){ state.cartExpanded = !state.cartExpanded; render(); }

  function openCheckout(){
    var mesaId = (state.activeTab==='mesas' && state.activeMesa) ? state.activeMesa : null;
    var items = mesaId ? (activeMesaObj() ? activeMesaObj().items : []) : state.cart;
    if(!items.length) return;
    state.modal = {type:'checkout', payment:'', mesaId: mesaId, tip:{kind:'none', value:0}};
    render();
  }
  function selectPayment(method){ if(state.modal) { state.modal.payment = method; render(); } }
  function modalTotal(){
    if(state.modal && state.modal.mesaId){
      var m = state.mesas.find(function(x){ return x.id===state.modal.mesaId; });
      return m ? m.items.reduce(function(s,l){ return s+l.price*l.qty; }, 0) : 0;
    }
    return cartSubtotal();
  }
  function setTipNone(){ if(!state.modal) return; state.modal.tip = {kind:'none', value:0}; render(); }
  function setTipPct10(){ if(!state.modal) return; state.modal.tip = {kind:'pct', value:10}; render(); }
  function setTipCustomPct(){ if(!state.modal) return; state.modal.tip = {kind:'pct', value:''}; render(); setTimeout(function(){ var i=$id('tip-custom-input'); if(i) i.focus(); }, 0); }
  function setTipCustomAmount(){ if(!state.modal) return; state.modal.tip = {kind:'amount', value:''}; render(); setTimeout(function(){ var i=$id('tip-custom-input'); if(i) i.focus(); }, 0); }
  function setTipCustomValue(val){ if(!state.modal || !state.modal.tip) return; state.modal.tip.value = val; }
  function tipAmountValue(){
    if(!state.modal || !state.modal.tip || state.modal.tip.kind==='none') return 0;
    var base = modalTotal();
    var v = Number(state.modal.tip.value)||0;
    if(state.modal.tip.kind==='pct') return Math.round(base*v/100);
    if(state.modal.tip.kind==='amount') return Math.round(v);
    return 0;
  }
  function grandTotal(){ return modalTotal() + tipAmountValue(); }
  function $id(id){ return document.getElementById(id); }

  async function confirmOrder(){
    if(!state.modal || !state.modal.payment || !state.db) return;
    var mesaObj = state.modal.mesaId ? state.mesas.find(function(x){ return x.id===state.modal.mesaId; }) : null;
    var sourceItems = mesaObj ? mesaObj.items : state.cart;
    var items = sourceItems.map(function(l){ var it = {name:l.name, price:l.price, qty:l.qty}; if(l.note) it.note = l.note; return it; });
    var subtotal = items.reduce(function(s,l){ return s+l.price*l.qty; }, 0);
    var tip = mesaObj ? tipAmountValue() : 0;
    var total = subtotal + tip;
    var todayCount = state.orders.filter(function(o){ return dateStrOf(o.createdAt)===todayStr(); }).length;
    var number = todayCount + 1;
    var order = {
      number: number, items: items, subtotal: subtotal, tip: tip, total: total,
      payment: state.modal.payment, status:'completado',
      createdAt: new Date().toISOString(),
      createdBy: state.currentUser ? state.currentUser.name : ''
    };
    if(mesaObj){ order.mesa = mesaObj.name; if(mesaObj.guests) order.guests = mesaObj.guests; }
    try{
      await state.db.collection('orders').add(order);
      if(mesaObj){
        await state.db.collection('mesas').doc(mesaObj.id).update({occupied:false, items:[], guests:null});
        state.activeMesa = null;
      } else {
        state.cart = [];
      }
      state.ticket = order;
      state.cartExpanded=false; state.modal=null;
      render();
    }catch(e){
      state.modalError = 'No se pudo guardar el pedido. Intenta de nuevo.';
      render();
    }
  }

  /* ---------------- mesas ---------------- */
  function activeMesaObj(){ return state.mesas.find(function(x){ return x.id===state.activeMesa; }); }
  function openMesaTable(id){ state.activeMesa = id; state.mesaCategory='all'; state.cartExpanded=false; render(); }
  function backFromMesa(){ state.activeMesa = null; render(); }
  function setMesaCategory(cat){ state.mesaCategory = cat; render(); }
  function persistMesa(id, patch){ if(!state.db) return; state.db.collection('mesas').doc(id).update(patch).catch(function(){}); }

  function addToMesaCart(pid){
    var m = activeMesaObj(); if(!m) return;
    var p = state.products.find(function(x){ return x.id===pid; });
    if(!p || p.active===false) return;
    var wasEmpty = !m.items.length;
    var line = m.items.find(function(l){ return l.id===pid; });
    if(line) line.qty += 1;
    else m.items.push({id:p.id, name:p.name, price:Number(p.price)||0, qty:1});
    if(wasEmpty){ m.occupied = true; m.openedAt = new Date().toISOString(); }
    render();
    persistMesa(m.id, wasEmpty ? {items:m.items, occupied:true, openedAt:m.openedAt} : {items:m.items});
  }
  function mesaInc(pid){ var m=activeMesaObj(); if(!m) return; var l=m.items.find(function(x){return x.id===pid;}); if(l){ l.qty+=1; render(); persistMesa(m.id,{items:m.items}); } }
  function mesaDec(pid){ var m=activeMesaObj(); if(!m) return; var l=m.items.find(function(x){return x.id===pid;}); if(l){ l.qty-=1; if(l.qty<=0) m.items=m.items.filter(function(x){return x.id!==pid;}); render(); persistMesa(m.id,{items:m.items}); } }
  function mesaRemove(pid){ var m=activeMesaObj(); if(!m) return; m.items = m.items.filter(function(x){ return x.id!==pid; }); render(); persistMesa(m.id,{items:m.items}); }
  function liberarMesa(){ var m=activeMesaObj(); if(!m || m.items.length) return; m.occupied=false; m.guests=null; state.activeMesa=null; render(); persistMesa(m.id,{occupied:false, guests:null}); }
  function setMesaGuests(val){ var m=activeMesaObj(); if(!m) return; var n = val===''? null : Number(val); m.guests = n; persistMesa(m.id,{guests:n}); }
  function mesaLineNote(pid){
    var m = activeMesaObj(); if(!m) return;
    var l = m.items.find(function(x){ return x.id===pid; }); if(!l) return;
    var val = window.prompt('Comentario para "'+l.name+'":', l.note||'');
    if(val===null) return;
    l.note = val.trim();
    render();
    persistMesa(m.id, {items:m.items});
  }
  function closeTicket(){ state.ticket=null; render(); }
  function closeModal(){ state.modal=null; state.modalError=''; render(); }

  function confirmVoidOrder(id){ state.confirmBox = {text:'¿Anular este pedido? El monto dejará de contarse en las ventas.', action:function(){ voidOrder(id); }}; render(); }
  async function voidOrder(id){
    state.confirmBox=null; render();
    if(!state.db) return;
    try{ await state.db.collection('orders').doc(id).update({status:'anulado'}); }catch(e){}
  }

  function newProduct(){ state.modal = {type:'product', data:{name:'', price:'', category:'', active:true}}; state.modalError=''; render(); }
  function editProduct(id){ var p = state.products.find(function(x){return x.id===id;}); if(!p) return; state.modal={type:'product', data:Object.assign({id:id}, p)}; state.modalError=''; render(); }
  async function saveProduct(form){
    if(!state.db) return;
    var name = form.name.value.trim();
    var price = Number(form.price.value);
    var category = form.category.value.trim() || 'Otros';
    var active = form.active.checked;
    if(!name || !(price>=0)){ state.modalError='Completa un nombre y un precio válido.'; render(); return; }
    var data = {name:name, price:price, category:category, active:active};
    try{
      if(state.modal.data.id) await state.db.collection('products').doc(state.modal.data.id).update(data);
      else await state.db.collection('products').add(Object.assign(data, {createdAt:new Date().toISOString()}));
      state.modal=null; render();
    }catch(e){ state.modalError='No se pudo guardar el producto.'; render(); }
  }
  async function toggleProductActive(id){
    var p = state.products.find(function(x){return x.id===id;});
    if(!p || !state.db) return;
    try{ await state.db.collection('products').doc(id).update({active: !(p.active!==false)}); }catch(e){}
  }
  function confirmDeleteProduct(id){
    var p = state.products.find(function(x){return x.id===id;});
    state.confirmBox = {text:'¿Eliminar "'+(p?p.name:'')+'"? Esta acción no se puede deshacer.', action:function(){ deleteProduct(id); }};
    render();
  }
  async function deleteProduct(id){
    state.confirmBox=null; render();
    if(!state.db) return;
    try{ await state.db.collection('products').doc(id).delete(); }catch(e){}
  }

  function newUser(){ state.modal = {type:'user', data:{name:'', pin:'', role:'cajero'}}; state.modalError=''; render(); }
  function editUser(id){ var u = state.users.find(function(x){return x.id===id;}); if(!u) return; state.modal={type:'user', data:Object.assign({id:id}, u)}; state.modalError=''; render(); }
  async function saveUser(form){
    if(!state.db) return;
    var name = form.name.value.trim();
    var pin = form.pin.value.trim();
    var role = form.role.value;
    if(!name || !/^\d{4}$/.test(pin)){ state.modalError='El nombre es obligatorio y el PIN debe tener 4 dígitos.'; render(); return; }
    var dupe = state.users.find(function(u){ return u.pin===pin && u.id!==state.modal.data.id; });
    if(dupe){ state.modalError='Ese PIN ya lo usa '+dupe.name+'.'; render(); return; }
    var data = {name:name, pin:pin, role:role};
    try{
      if(state.modal.data.id) await state.db.collection('users').doc(state.modal.data.id).update(data);
      else await state.db.collection('users').add(Object.assign(data, {createdAt:new Date().toISOString()}));
      state.modal=null; render();
    }catch(e){ state.modalError='No se pudo guardar el usuario.'; render(); }
  }
  function togglePinVisible(id){ state.pinVisible[id] = !state.pinVisible[id]; render(); }
  function confirmDeleteUser(id){
    var u = state.users.find(function(x){return x.id===id;});
    if(state.users.length<=1){ state.confirmBox={text:'Debe quedar al menos un usuario con acceso.', action:null}; render(); return; }
    state.confirmBox = {text:'¿Eliminar a '+(u?u.name:'')+'? Ya no podrá ingresar con su PIN.', action:function(){ deleteUser(id); }};
    render();
  }
  async function deleteUser(id){
    state.confirmBox=null; render();
    if(!state.db) return;
    try{ await state.db.collection('users').doc(id).delete(); }catch(e){}
  }
  function closeConfirm(){ state.confirmBox=null; render(); }

  function editBusiness(){ state.modal = {type:'business', data:Object.assign({}, state.settings)}; state.modalError=''; render(); }
  async function saveBusiness(form){
    if(!state.db) return;
    var name = form.businessName.value.trim() || 'Mostrador POS';
    var subtitle = form.subtitle.value.trim();
    try{
      await state.db.doc('settings/general').set({businessName:name, subtitle:subtitle});
      state.modal=null; render();
    }catch(e){ state.modalError='No se pudo guardar.'; render(); }
  }

  /* ---------------- render: shell ---------------- */
  function render(){
    var app = document.getElementById('app');
    if(state.db===undefined){
      app.innerHTML = fullscreenMsg(icon('receipt'), state.settings.businessName, 'Cargando…');
      return;
    }
    if(!state.currentUser){
      app.innerHTML = renderLogin();
      return;
    }
    var visibleTabs = TABS.filter(function(t){ return t.roles.indexOf(state.currentUser.role)>-1; });
    var html = '';
    html += '<header class="topbar">';
    html += '<div class="brand">';
    html += '<img class="logo-header" src="logo.jpg" alt="'+escapeHtml(state.settings.businessName)+'">';
    if(isAdmin()) html += '<button class="btn-icon" data-action="editBusiness" aria-label="Editar negocio">'+icon('pencil')+'</button>';
    html += '<div class="brand-text"><h1 class="brand-name">'+escapeHtml(state.settings.businessName)+'</h1>';
    if(state.settings.subtitle) html += '<p class="brand-sub">'+escapeHtml(state.settings.subtitle)+'</p>';
    html += '</div></div>';
    html += '<div class="session"><div class="user-chip"><span class="uname">'+escapeHtml(state.currentUser.name)+'</span><span class="badge badge-'+state.currentUser.role+'">'+(state.currentUser.role==='admin'?'Admin':'Cajero')+'</span></div>';
    html += '<button class="btn-icon" data-action="logout" aria-label="Cerrar sesión">'+icon('logout')+'</button></div>';
    html += '</header>';

    html += '<nav class="tabs">';
    visibleTabs.forEach(function(t){
      html += '<button class="tab-btn'+(state.activeTab===t.id?' active':'')+'" data-action="setTab" data-tab="'+t.id+'">'+icon(t.icon,'icon-sm')+'<span>'+t.label+'</span></button>';
    });
    html += '</nav>';

    html += '<main class="content">';
    if(state.activeTab==='mostrador') html += renderMostrador();
    else if(state.activeTab==='mesas') html += renderMesas();
    else if(state.activeTab==='productos' && isAdmin()) html += renderProductos();
    else if(state.activeTab==='ventas') html += renderVentas();
    else if(state.activeTab==='reportes' && isAdmin()) html += renderReportes();
    else if(state.activeTab==='usuarios' && isAdmin()) html += renderUsuarios();
    html += '</main>';

    if(state.modal) html += renderModal();
    if(state.confirmBox) html += renderConfirm();
    if(state.ticket) html += renderTicket();

    app.innerHTML = html;
  }

  function fullscreenMsg(ic, title, msg){
    return '<div class="login-wrap"><div class="login-card">'+
      '<div style="margin-bottom:14px; opacity:.7">'+ic+'</div>'+
      '<h1 class="brand-name">'+escapeHtml(title)+'</h1>'+
      '<p class="brand-sub" style="margin-top:10px; line-height:1.5">'+escapeHtml(msg)+'</p>'+
      '</div></div>';
  }

  /* ---------------- render: login ---------------- */
  function renderLogin(){
    var dots='';
    for(var i=0;i<4;i++) dots += '<div class="pin-dot'+(i<state.pinBuffer.length?' filled':'')+'"></div>';
    var keys = ['1','2','3','4','5','6','7','8','9'];
    var pad = '<div class="keypad">';
    keys.forEach(function(k){ pad += '<button class="key-btn" data-action="pinKey" data-key="'+k+'">'+k+'</button>'; });
    pad += '<button class="key-btn key-sub" data-action="pinKey" data-key="clear">Borrar</button>';
    pad += '<button class="key-btn" data-action="pinKey" data-key="0">0</button>';
    pad += '<button class="key-btn key-sub" data-action="pinKey" data-key="back">⌫</button>';
    pad += '</div>';
    var hint = !state.usersLoaded ? 'Verificando…' : (state.usersLoaded && state.users.length===0 ? 'Crea tu PIN de administrador: ingresa 4 dígitos nuevos.' : '');

  function renderCartContent(items, opts){
    opts = opts || {};
    var inc = opts.inc || 'cartInc', dec = opts.dec || 'cartDec', rem = opts.remove || 'cartRemove', title = opts.title || 'Pedido actual';
    var noteAction = opts.note || null;
    var count = items.reduce(function(s,l){ return s+l.qty; }, 0);
    var total = items.reduce(function(s,l){ return s+l.price*l.qty; }, 0);
    var h = '<div class="cart-header"><h2>'+title+'</h2><span class="cart-count">'+count+' ítem'+(count===1?'':'s')+'</span></div>';
    if(!items.length){
      h += '<div class="cart-empty">Toca un producto para agregarlo.</div>';
    } else {
      h += '<div class="cart-items">';
      items.forEach(function(l){
        h += '<div class="cart-line">'+
          '<div class="cart-line-top"><span class="cart-line-name">'+escapeHtml(l.name)+'</span><span class="cart-line-total tnum">'+fmtCLP(l.price*l.qty)+'</span></div>'+
          (l.note ? '<div class="cart-line-note">'+escapeHtml(l.note)+'</div>' : '')+
          '<div class="cart-line-bottom"><div class="qty-stepper">'+
            '<button data-action="'+dec+'" data-id="'+l.id+'">'+icon('minus','icon-sm')+'</button>'+
            '<span class="qty-val tnum">'+l.qty+'</span>'+
            '<button data-action="'+inc+'" data-id="'+l.id+'">'+icon('plus','icon-sm')+'</button>'+
          '</div><div style="display:flex">'+
          (noteAction ? '<button class="cart-note-btn" data-action="'+noteAction+'" data-id="'+l.id+'" aria-label="Comentario">'+icon('pencil','icon-sm')+'</button>' : '')+
          '<button class="cart-remove" data-action="'+rem+'" data-id="'+l.id+'">'+icon('x','icon-sm')+'</button></div></div>'+
        '</div>';
      });
      h += '</div>';
    }
    h += '<div class="cart-totals"><div class="cart-total-row"><span>Total</span><span class="tnum">'+fmtCLP(total)+'</span></div></div>';
    h += '<button class="btn btn-primary btn-block" data-action="openCheckout"'+(items.length?'':' disabled')+'>Cobrar '+(items.length?fmtCLP(total):'')+'</button>';
    return h;
  }

  /* ---------------- render: ventas ---------------- */
  function renderVentas(){
    if(!state.ordersLoaded) return '<div class="loading-block"><span class="spinner"></span> Cargando ventas…</div>';
    var dayOrders = state.orders.filter(function(o){ return dateStrOf(o.createdAt)===state.ventasDate; });
    dayOrders.sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); });
    var completed = dayOrders.filter(function(o){ return o.status!=='anulado'; });
    var total = completed.reduce(function(s,o){ return s+(o.total||0); }, 0);
    var avg = completed.length ? total/completed.length : 0;

    var h = '<div class="date-filter"><label style="margin:0">Fecha</label><input type="date" id="ventas-date" value="'+state.ventasDate+'"></div>';
    h += '<div class="stat-row">'+
      '<div class="stat-tile"><div class="stat-label">Total del día</div><div class="stat-value tnum">'+fmtCLP(total)+'</div></div>'+
      '<div class="stat-tile"><div class="stat-label">Pedidos</div><div class="stat-value tnum">'+completed.length+'</div></div>'+
      '<div class="stat-tile"><div class="stat-label">Ticket promedio</div><div class="stat-value tnum">'+fmtCLP(avg)+'</div></div>'+
    '</div>';

    if(!dayOrders.length){ h += '<div class="empty-state">'+icon('chart')+'<p>No hay pedidos en esta fecha.</p></div>'; return h; }

    dayOrders.forEach(function(o){
      var voided = o.status==='anulado';
      h += '<div class="data-row'+(voided?' inactive':'')+'">'+
        '<div class="data-row-main"><div class="data-row-title"><span class="tnum">#'+o.number+'</span> · '+fmtTime(o.createdAt)+' · <span class="badge badge-'+(voided?'anulado':'completado')+'">'+(voided?'Anulado':'Completado')+'</span></div>'+
        '<div class="data-row-sub">'+(o.items||[]).length+' ítem'+(((o.items||[]).length===1)?'':'s')+' · '+paymentLabel(o.payment)+' · '+escapeHtml(o.createdBy||'')+'</div></div>'+
        '<div class="data-row-actions"><span class="tnum" style="font-weight:700; margin-right:4px">'+fmtCLP(o.total)+'</span>'+
        (!voided && isAdmin() ? '<button class="btn-icon" data-action="confirmVoidOrder" data-id="'+o.id+'">'+icon('trash','icon-sm')+'</button>' : '')+
        '</div></div>';
    });
    return h;
  }

  /* ---------------- render: reportes ---------------- */
  function renderReportes(){
    if(!state.ordersLoaded) return '<div class="loading-block"><span class="spinner"></span> Cargando reportes…</div>';
    var today = todayStr();
    var todayOrders = state.orders.filter(function(o){ return dateStrOf(o.createdAt)===today && o.status!=='anulado'; });
    var totalToday = todayOrders.reduce(function(s,o){ return s+(o.total||0); }, 0);
    var avgToday = todayOrders.length ? totalToday/todayOrders.length : 0;

    var byPayment = {};
    todayOrders.forEach(function(o){ var k=o.payment||'otro'; byPayment[k]=(byPayment[k]||0)+o.total; });
    var payMax = Math.max.apply(null, Object.keys(byPayment).map(function(k){return byPayment[k];}).concat([1]));

    var cutoff = Date.now() - 30*24*60*60*1000;
    var recent = state.orders.filter(function(o){ return o.status!=='anulado' && new Date(o.createdAt).getTime()>=cutoff; });
    var prodAgg = {};
    recent.forEach(function(o){ (o.items||[]).forEach(function(it){
      if(!prodAgg[it.name]) prodAgg[it.name]={qty:0, revenue:0};
      prodAgg[it.name].qty += it.qty; prodAgg[it.name].revenue += it.qty*it.price;
    }); });
    var topProducts = Object.keys(prodAgg).map(function(name){ return {name:name, qty:prodAgg[name].qty, revenue:prodAgg[name].revenue}; })
      .sort(function(a,b){ return b.qty-a.qty; }).slice(0,5);
    var topMax = Math.max.apply(null, topProducts.map(function(p){return p.qty;}).concat([1]));

    var h = '<div class="stat-row">'+
      '<div class="stat-tile"><div class="stat-label">Ventas de hoy</div><div class="stat-value tnum">'+fmtCLP(totalToday)+'</div></div>'+
      '<div class="stat-tile"><div class="stat-label">Pedidos de hoy</div><div class="stat-value tnum">'+todayOrders.length+'</div></div>'+
      '<div class="stat-tile"><div class="stat-label">Ticket promedio</div><div class="stat-value tnum">'+fmtCLP(avgToday)+'</div></div>'+
    '</div>';

    h += '<div class="panel"><h3>Ventas por método de pago (hoy)</h3>';
    if(!Object.keys(byPayment).length){ h += '<p style="color:var(--muted); font-size:13px; margin:0">Sin ventas registradas hoy.</p>'; }
    else{ Object.keys(byPayment).forEach(function(k){
      h += '<div class="bar-row"><span class="bar-label">'+paymentLabel(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(4,100*byPayment[k]/payMax)+'%"></div></div><span class="bar-value tnum">'+fmtCLP(byPayment[k])+'</span></div>';
    }); }
    h += '</div>';

    h += '<div class="panel"><h3>Productos más vendidos (últimos 30 días)</h3>';
    if(!topProducts.length){ h += '<p style="color:var(--muted); font-size:13px; margin:0">Todavía no hay ventas suficientes.</p>'; }
    else{ topProducts.forEach(function(p){
      h += '<div class="bar-row"><span class="bar-label">'+escapeHtml(p.name)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(4,100*p.qty/topMax)+'%"></div></div><span class="bar-value tnum">'+p.qty+' uds.</span></div>';
    }); }
    h += '</div>';
    return h;
  }

  function renderConfirm(){
    var c = state.confirmBox;
    var actions = c.action
      ? '<button class="btn btn-secondary" data-action="closeConfirm">Cancelar</button><button class="btn btn-danger" data-action="runConfirm">Eliminar</button>'
      : '<button class="btn btn-primary btn-block" data-action="closeConfirm">Entendido</button>';
    return '<div class="modal-backdrop" data-action="backdropCloseConfirm"><div class="modal" style="max-width:360px">'+
      '<p class="confirm-text">'+escapeHtml(c.text)+'</p><div class="modal-actions">'+actions+'</div></div></div>';
  }

  function renderTicket(){
    var o = state.ticket;
    var itemsHtml = (o.items||[]).map(function(it){
      return '<div class="ticket-item-row"><span class="ti-name">'+it.qty+'× '+escapeHtml(it.name)+'</span><span class="tnum">'+fmtCLP(it.price*it.qty)+'</span></div>'+
        (it.note ? '<div class="ticket-item-note">'+escapeHtml(it.note)+'</div>' : '');
    }).join('');
    var tipRow = o.tip ? '<div class="ticket-item-row"><span class="ti-name">Propina</span><span class="tnum">'+fmtCLP(o.tip)+'</span></div>' : '';
    return '<div class="modal-backdrop"><div class="modal ticket">'+
      '<div class="ticket-head"><div class="brand-name" style="font-size:16px">'+escapeHtml(state.settings.businessName)+'</div>'+
      '<div class="tnum-badge">Pedido #'+o.number+'</div></div>'+
      '<div class="ticket-items">'+itemsHtml+tipRow+'</div>'+
      '<div class="ticket-foot"><span>Total</span><span class="amount tnum">'+fmtCLP(o.total)+'</span></div>'+
      '<div class="ticket-meta">'+(o.mesa?escapeHtml(o.mesa)+(o.guests?' · '+o.guests+' comensales':'')+' · ':'')+paymentLabel(o.payment)+' · '+fmtDateHuman(o.createdAt)+'</div>'+
      '<button class="btn btn-primary btn-block" data-action="closeTicket">Nuevo pedido</button>'+
      '</div></div>';
  }

  /* ---------------- event delegation ---------------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    switch(action){
      case 'pinKey': pinKey(el.dataset.key); break;
      case 'logout': logout(); break;
      case 'setTab': setTab(el.dataset.tab); break;
      case 'setCategory': setCategory(el.dataset.cat); break;
      case 'addToCart': addToCart(id); break;
      case 'cartInc': cartInc(id); break;
      case 'cartDec': cartDec(id); break;
      case 'cartRemove': cartRemove(id); break;
      case 'toggleCart': toggleCartSheet(); break;
      case 'openCheckout': openCheckout(); break;
      case 'selectPayment': selectPayment(el.dataset.method); break;
      case 'confirmOrder': confirmOrder(); break;
      case 'closeTicket': closeTicket(); break;
      case 'closeModal': closeModal(); break;
      case 'backdropClose': if(e.target===el) closeModal(); break;
      case 'newProduct': newProduct(); break;
      case 'editProduct': editProduct(id); break;
      case 'toggleProductActive': toggleProductActive(id); break;
      case 'confirmDeleteProduct': confirmDeleteProduct(id); break;
      case 'confirmVoidOrder': confirmVoidOrder(id); break;
      case 'newUser': newUser(); break;
      case 'editUser': editUser(id); break;
      case 'togglePin': togglePinVisible(id); break;
      case 'confirmDeleteUser': confirmDeleteUser(id); break;
      case 'closeConfirm': closeConfirm(); break;
      case 'backdropCloseConfirm': if(e.target===el) closeConfirm(); break;
      case 'runConfirm': if(state.confirmBox && state.confirmBox.action) state.confirmBox.action(); break;
      case 'editBusiness': editBusiness(); break;
      case 'openMesaTable': openMesaTable(id); break;
      case 'backFromMesa': backFromMesa(); break;
      case 'setMesaCategory': setMesaCategory(el.dataset.cat); break;
      case 'addToMesaCart': addToMesaCart(id); break;
      case 'mesaInc': mesaInc(id); break;
      case 'mesaDec': mesaDec(id); break;
      case 'mesaRemove': mesaRemove(id); break;
      case 'liberarMesa': liberarMesa(); break;
      case 'mesaLineNote': mesaLineNote(id); break;
      case 'setTipNone': setTipNone(); break;
      case 'setTipPct10': setTipPct10(); break;
      case 'setTipCustomPct': setTipCustomPct(); break;
      case 'setTipCustomAmount': setTipCustomAmount(); break;
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.id==='ventas-date'){ state.ventasDate = e.target.value; render(); }
    else if(e.target.id==='mesa-guests'){ setMesaGuests(e.target.value); }
    else if(e.target.id==='tip-custom-input'){ setTipCustomValue(e.target.value); render(); }
  });

  // Let the PIN screen be typed with the keyboard (laptop number row or numpad),
  // not just tapped on screen.
  document.addEventListener('keydown', function(e){
    if(state.currentUser) return;
    if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='SELECT' || e.target.tagName==='TEXTAREA')) return;
    var key = e.key;
    if(/^[0-9]$/.test(key)){ e.preventDefault(); pinKey(key); }
    else if(key==='Backspace'){ e.preventDefault(); pinKey('back'); }
    else if(key==='Escape' || key==='Delete'){ e.preventDefault(); pinKey('clear'); }
  });

  document.addEventListener('submit', function(e){
    if(e.target.id==='product-form'){ e.preventDefault(); saveProduct(e.target); }
    else if(e.target.id==='user-form'){ e.preventDefault(); saveUser(e.target); }
    else if(e.target.id==='business-form'){ e.preventDefault(); saveBusiness(e.target); }
  });

  render();
  initDb();
})();
</script>
</body>
</html>
