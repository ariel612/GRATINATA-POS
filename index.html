<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gratinata POS</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyB0kxcY3i2oePOhsh7Ufq4Cka4vWWB9iig",
  authDomain: "gratinata-pos.firebaseapp.com",
  databaseURL: "https://gratinata-pos-default-rtdb.firebaseio.com",
  projectId: "gratinata-pos",
  storageBucket: "gratinata-pos.firebasestorage.app",
  messagingSenderId: "347257652011",
  appId: "1:347257652011:web:56f29480bf953ee9787b6e"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window._db=db;window._ref=ref;window._push=push;window._onValue=onValue;window._set=set;window._update=update;window._remove=remove;window._dbReady=true;
window.dispatchEvent(new Event("dbReady"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#c9a84c;--acc2:#e8c96a;--acc-dark:#a07830;
  --top:#1a1a2e;--tab:#2c2c3e;--tab-tx:rgba(255,255,255,.65);
  --bg:#f4f5f7;--card:#fff;--bd:#e2e5ea;
  --tx:#2c3e50;--mt:#8a93a2;
  --red:#e74c3c;--green:#27ae60;--blue:#3498db;--orange:#e67e22;
  --mesa-libre:#27ae60;--mesa-occ:#3498db;
}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:14px;height:100vh;overflow:hidden}
button{cursor:pointer;font-family:inherit;border:none;border-radius:6px;transition:filter .1s}
button:active{filter:brightness(.9)}
input,select,textarea{font-family:inherit;font-size:13px;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;color:var(--tx);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--top);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:1000}
#login-screen.hide{display:none}
.ls-logo{color:var(--acc);font-size:30px;font-weight:700;letter-spacing:3px}
.ls-sub{color:rgba(255,255,255,.4);font-size:12px;letter-spacing:1px}
.ls-users{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:340px}
.ls-user{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 18px;color:#fff;font-size:13px;font-weight:600;min-width:100px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ls-user:active{background:rgba(201,168,76,.2);border-color:var(--acc)}
.ls-avatar{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#000;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ls-pin-wrap{display:none;flex-direction:column;align-items:center;gap:14px}
.ls-pin-title{color:#fff;font-size:15px;font-weight:600}
.pin-display{display:flex;gap:12px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:transparent;transition:background .12s}
.pin-dot.filled{background:var(--acc);border-color:var(--acc)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:210px}
.pp-btn{background:rgba(255,255,255,.08);color:#fff;font-size:20px;font-weight:600;padding:13px;border-radius:10px}
.pp-btn:active{background:rgba(201,168,76,.25)}
.ls-error{color:var(--red);font-size:12px;height:16px;text-align:center}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh}

/* TOP HEADER */
#top-hdr{background:var(--top);height:52px;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;position:relative;z-index:50}
#mod-btn{display:flex;align-items:center;gap:8px;background:transparent;color:#fff;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600}
#mod-btn:hover{background:rgba(255,255,255,.08)}
#mod-btn .mod-ic{font-size:18px}
#mod-btn .mod-arrow{font-size:10px;color:rgba(255,255,255,.5);margin-left:2px}
#mod-menu{display:none;position:absolute;top:52px;left:0;background:var(--top);border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);border-radius:0 0 10px 0;padding:8px 0;min-width:200px;z-index:100}
#mod-menu.on{display:block}
.mm-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;color:rgba(255,255,255,.7);padding:10px 16px;font-size:13px;border-radius:0}
.mm-item:hover{background:rgba(255,255,255,.07);color:#fff}
.mm-item.on{color:var(--acc);font-weight:600}
.mm-item .mm-ic{font-size:16px;width:22px}
#top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
#top-user{color:rgba(255,255,255,.7);font-size:12px;font-weight:600}
.top-ic-btn{background:transparent;color:rgba(255,255,255,.6);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.top-ic-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.kds-badge-top{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:-6px;margin-top:-8px}

/* SUB TABS */
#sub-tabs{background:var(--tab);display:flex;overflow-x:auto;flex-shrink:0}
#sub-tabs::-webkit-scrollbar{height:0}
.st{background:transparent;color:var(--tab-tx);padding:11px 16px;font-size:13px;border-radius:0;white-space:nowrap;border-bottom:2px solid transparent}
.st.on{color:#fff;border-bottom-color:var(--acc);font-weight:600}
.st:hover{color:#fff}

/* CONTENT */
#content{flex:1;overflow:hidden;display:flex}
.view{display:none;flex:1;overflow:hidden}
.view.on{display:flex}

/* MASTER-DETAIL layout */
.md-layout{display:flex;flex:1;overflow:hidden}
.md-left{width:220px;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;flex-shrink:0}
.md-right{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.md-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mt);font-size:14px}

/* BUTTONS */
.bp{background:var(--acc);color:#fff;padding:9px 16px;font-weight:600;font-size:13px}
.bp:hover{background:var(--acc2);color:#000}
.bs{background:#fff;color:var(--tx);border:1px solid var(--bd);padding:7px 12px;font-size:13px}
.bs:hover{background:#f8f9fb}
.bd2{background:var(--red);color:#fff;padding:7px 12px;font-size:13px}
.bg2{background:var(--green);color:#fff;padding:7px 12px;font-size:13px}
.chip{background:#f0f2f5;color:var(--tx);border-radius:14px;padding:4px 11px;font-size:12px;border:1px solid transparent}
.chip.on{background:var(--acc);color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px}
.metric{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:center}
.metric .lbl{font-size:11px;color:var(--mt);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.metric .val{font-size:18px;font-weight:700}

/* ── RESTAURANTE / VENDER ── */
#v-vender{flex-direction:column}
#vender-tabs{background:#fff;border-bottom:1px solid var(--bd);display:flex;padding:0 14px;gap:0;flex-shrink:0}
.vt{background:transparent;color:var(--mt);padding:10px 14px;font-size:13px;border-bottom:2px solid transparent;border-radius:0}
.vt.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
#vender-content{flex:1;overflow:hidden;display:flex}

/* MOSTRADOR / DELIVERY — split */
#sell-left{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
#sell-right{width:300px;background:#fff;border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sell-meta{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:7px}
.cat-sidebar{width:160px;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;flex-shrink:0;padding:8px 0}
.cat-item{display:block;width:100%;background:transparent;color:var(--tx);padding:10px 14px;text-align:left;font-size:13px;border-left:3px solid transparent;border-radius:0}
.cat-item.on{color:var(--acc);border-left-color:var(--acc);font-weight:600;background:#fdf8ec}
.cat-item:hover{background:#f8f9fb}
.prod-area{flex:1;overflow-y:auto;padding:12px;background:var(--bg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px}
.mi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:11px;text-align:left;color:var(--tx);position:relative;border-left:3px solid var(--acc)}
.mi:hover,.mi:active{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mi.out{opacity:.4;pointer-events:none}
.mi-name{font-weight:500;font-size:13px;margin-bottom:4px}
.mi-price{color:var(--acc);font-weight:700;font-size:13px}
.mi-fav{position:absolute;top:5px;right:6px;font-size:10px}
.mi-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}

/* TICKET */
#tk-hdr{padding:10px 13px;border-bottom:1px solid var(--bd);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.5px;color:var(--tx)}
#tk-list{flex:1;overflow-y:auto;padding:0 12px}
.cr{padding:8px 0;border-bottom:1px solid #f0f2f5}
.cr-left-bar{border-left:3px solid var(--acc);padding-left:8px}
.cr-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.cr-name{font-size:13px;font-weight:500;flex:1}
.cr-qty{display:flex;align-items:center;gap:5px}
.qb{background:#f0f2f5;color:var(--tx);border-radius:5px;width:26px;height:26px;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
.cr-sub{font-size:11px;color:var(--mt);margin-top:2px}
.cr-chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.cr-note{margin-top:5px;font-size:12px;height:32px;padding:5px 8px}
#tk-foot{border-top:1px solid var(--bd);padding:12px}
.tk-line{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--mt)}
.tk-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin:6px 0 10px}
.disc-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.promo-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}

/* MESAS */
#v-mesas{flex-direction:column}
#mesas-hdr{background:#fff;border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#mesas-hdr .tab-count{background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px}
#mesa-canvas-wrap{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.mesa-zone{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.mesa-zone-hdr{padding:10px 14px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;background:#fafafa}
.mesa-canvas{position:relative;width:100%;height:280px}
.mbox{position:absolute;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:box-shadow .15s}
.mbox.sq{width:66px;height:66px;border-radius:10px;background:#eafaf1;border:2px solid var(--mesa-libre)}
.mbox.rect{width:106px;height:60px;border-radius:10px;background:#eafaf1;border:2px solid var(--mesa-libre)}
.mbox.circ{width:66px;height:66px;border-radius:50%;background:#eafaf1;border:2px solid var(--mesa-libre)}
.mbox.occ{background:#e8f4fc;border-color:var(--mesa-occ)}
.mbox:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.mbox-name{font-weight:700;font-size:13px;color:var(--tx)}
.mbox.occ .mbox-name{color:var(--mesa-occ)}
.mbox-g{font-size:10px;color:var(--mesa-occ)}
.mbox-time{font-size:9px;color:var(--mt)}
.mbox-free{font-size:10px;color:var(--mesa-libre)}
.mesa-edit-bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--bd);background:#fafafa}
.edit-mode .mbox{cursor:grab;opacity:.85}

/* KDS */
#v-kds .md-right{background:var(--bg)}
#kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kds-card{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kds-card.pending{border-left-color:var(--orange)}
.kds-card.prep{border-left-color:var(--blue)}
.kds-card.ready{border-left-color:var(--green)}
.kds-top{display:flex;justify-content:space-between;align-items:flex-start}
.kds-id{font-weight:700;font-size:14px}
.kds-type{font-size:11px;color:var(--mt)}
.kds-timer{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f0f2f5}
.kds-timer.warn{background:#fdf2e3;color:var(--orange)}
.kds-timer.late{background:#fdeaea;color:var(--red)}
.kds-items{font-size:13px;line-height:1.7}
.kds-note{font-size:11px;color:var(--acc-dark);margin-left:14px;font-weight:600}
.kds-actions{display:flex;gap:6px}
.kds-actions button{flex:1;padding:7px;font-size:12px;font-weight:600;border-radius:6px}

/* VENTAS */
#v-ventas .md-right{background:var(--bg)}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px}
.metrics4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hour-chart{display:flex;align-items:flex-end;gap:2px;height:70px}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.hbar{background:var(--acc);border-radius:3px 3px 0 0;width:100%;min-height:2px}
.hbar-lbl{font-size:9px;color:var(--mt);margin-top:2px}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f5;gap:6px}
.or-info{flex:1;font-size:13px}
.or-meta{font-size:11px;color:var(--mt)}
.sb{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap}
.s-pending{background:#fdf2e3;color:var(--orange)}
.s-prep{background:#e8f4fc;color:var(--blue)}
.s-ready{background:#eafaf1;color:var(--green)}
.s-done{background:#f0f2f5;color:var(--mt)}
.s-void{background:#fdeaea;color:var(--red)}

/* PRODUCTOS */
#v-productos{flex-direction:row}
.prod-cat-list{width:160px;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;flex-shrink:0;padding:8px 0}
.pcat{display:block;width:100%;background:transparent;color:var(--tx);padding:10px 14px;text-align:left;font-size:13px;border-left:3px solid transparent;border-radius:0}
.pcat.on{color:var(--acc);border-left-color:var(--acc);background:#fdf8ec;font-weight:600}
.pcat:hover{background:#f8f9fb}
.prod-main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.prod-hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prod-table-hdr{display:grid;grid-template-columns:1fr 80px 80px 80px 80px;gap:8px;padding:8px 12px;font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--bd)}
.prod-row{display:grid;grid-template-columns:1fr 80px 80px 80px 80px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid #f0f2f5;font-size:13px}
.prod-row:hover{background:#fafafa}

/* MENU EDITOR dentro de Productos */
.me-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid #f0f2f5}
.me-name{flex:1;font-size:13px}
.me-price{font-size:13px;color:var(--acc);font-weight:600;width:80px;text-align:right}

/* USUARIOS / CIERRE */
#v-usuarios{flex-direction:column;padding:16px;overflow-y:auto;gap:12px}
.user-card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;display:flex;align-items:center;gap:12px}
.u-avatar{width:40px;height:40px;border-radius:50%;background:var(--top);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.u-name{font-weight:600;font-size:14px}
.u-role{font-size:12px;color:var(--mt)}

/* OVERLAYS */
.ovl{display:none;position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:200;align-items:center;justify-content:center}
.ovl.on{display:flex}
.modal-box{background:#fff;border-radius:10px;padding:20px;width:min(360px,95vw);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal-title{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.pay-method{display:flex;gap:6px;flex-wrap:wrap}
.pm{flex:1;min-width:80px;padding:10px 8px;background:#f8f9fb;border:2px solid var(--bd);border-radius:8px;font-size:12px;font-weight:600;color:var(--tx);text-align:center}
.pm.on{border-color:var(--acc);background:#fdf8ec;color:var(--acc-dark)}
.tip-row{display:flex;gap:6px}
.tip-row .pm{min-width:0}
.split-info{background:#f8f9fb;border-radius:8px;padding:10px;font-size:13px;text-align:center}
.split-info b{font-size:18px;color:var(--acc)}
.pay-section-title{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}

/* COMANDAS */
.com-wrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center;padding:12px}
.com-card{background:#fff;border-radius:10px;padding:16px;width:min(290px,90vw)}
.com-brand{font-size:16px;font-weight:700;color:var(--top);text-align:center;letter-spacing:2px;text-transform:uppercase}
.com-sub{font-size:11px;color:var(--mt);text-align:center}
.com-info{font-size:13px;text-align:center;margin-top:5px;font-weight:700;text-transform:uppercase}
.com-meta{font-size:11px;color:var(--mt);text-align:center}
.com-divider{border:none;border-top:1px dashed var(--bd);margin:8px 0}
.com-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-left:3px solid var(--acc);padding-left:7px;margin-bottom:2px}
.com-note{font-size:11px;color:var(--mt);padding:0 0 4px 10px}
.com-total{display:flex;justify-content:space-between;margin-top:8px;font-weight:700;font-size:15px;border-top:1px dashed var(--bd);padding-top:8px}
.com-line{display:flex;justify-content:space-between;font-size:12px;color:var(--mt);padding:2px 0}
.com-btns{display:flex;gap:7px;margin-top:12px}
.com-btns button{flex:1;padding:10px;font-weight:600;font-size:13px;border-radius:7px}
.cocina-header{background:var(--top);color:#fff;text-align:center;padding:8px;border-radius:6px;margin-bottom:8px;font-size:12px;font-weight:700;letter-spacing:2px}

/* TOAST */
#toast{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--top);color:#fff;padding:11px 22px;border-radius:20px;font-size:13px;font-weight:600;z-index:400;white-space:nowrap;border:1px solid var(--acc)}
#toast.on{display:block;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* MOBILE NAV */
#mob-nav{display:none;background:var(--top);position:fixed;bottom:0;left:0;right:0;height:56px;z-index:90;align-items:stretch;border-top:1px solid rgba(255,255,255,.1)}
.mn{flex:1;background:transparent;color:rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;position:relative}
.mn.on{color:var(--acc)}
.mn .mic{font-size:19px}
.mn .mbadge{position:absolute;top:5px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px}

function initFirebase(){
  if(!window._dbReady)return;
  dbReady=true;
  const db=window._db,r=window._ref,ov=window._onValue;
  ov(r(db,"orders"),snap=>{
    const data=snap.val();
    if(!data)return;
    const remote=Object.entries(data).map(([k,v])=>({...v,_k:k}));
    const newCount=remote.filter(o=>o.date===td()&&!o.voided).length;
    updateKDSBadge();
    lastOrderCount=newCount;orders=remote;
    if(activeTab==="ventas")renderVentas();
    if(activeTab==="kds")renderKDS();
    fdRefresh();
  });
  ov(r(db,"tabs"),snap=>{
    const d=snap.val();
    openTabs=d?Object.values(d).map(normTab):[];
    if(selTabId&&!openTabs.some(t=>t.id===selTabId))selTabId=null;
    fdRefresh();
  });
  ov(r(db,"tickets"),snap=>{
    const d=snap.val();
    tickets=d?Object.values(d).map(normTicket):[];
    const n=tickets.filter(k=>k.status==="pending"&&k.date===td()).length;
    if(n>lastTicketCount&&currentUser)showToast();
    lastTicketCount=n;
    updateKDSBadge();
    if(activeTab==="kds")renderKDS();
  });
  ov(r(db,"station"),snap=>{stationTs=snap.val()?.ts||0;});
  ov(r(db,"jobs"),handleJobs);
  ov(r(db,"config/menu"),snap=>{
    const v=snap.val();
    if(v&&Array.isArray(v.items)&&v.items.length){
      MENU=v.items;menuIdCounter=Math.max(v.counter||1000,...MENU.map(x=>x.id+1));
      if(activeTab==="menu-edit")renderMenuEditor();else if(activeTab==="productos")renderProductos();
      if($("add-ovl")?.classList.contains("on")&&typeof renderAddModal==="function")renderAddModal();
    }else saveMenu();
  });
  ov(r(db,"config/tables"),snap=>{
    const v=snap.val();
    if(v&&Array.isArray(v.items)&&v.items.length){TABLES=v.items;try{localStorage.setItem("gp_tables",JSON.stringify(TABLES));}catch(e){}if(activeMod==="restaurante")renderFd();}
    else saveTables();
  });
  ov(r(db,"movs"),snap=>{movs=Object.values(snap.val()||{});if(activeTab==="movs")renderMovs();if(activeTab==="arqueos")renderArqueos();});
  ov(r(db,"cajas"),snap=>{cajas=Object.values(snap.val()||{});if(activeTab==="arqueos")renderArqueos();});
  heartbeat();
}

function addrStr(d){if(!d)return"";return[d.street,d.num].filter(Boolean).join(" ")+(d.apt?", "+d.apt:"")+(d.barrio?" · "+d.barrio:"");}
function tabLabel(t){
  if(t.type==="mesa")return`MESA ${tableName(t.table)}${t.guests?` — ${t.guests} PAX`:""}`;
  if(t.type==="delivery")return`DELIVERY: ${(t.client||"").toUpperCase()}`;
  return"MOSTRADOR"+(t.client?": "+t.client.toUpperCase():"");
}
function calcTotals(t){
  t=t||curTab();
  if(!t)return{gross:0,disc:0,fee:0,net:0};
  const items=t.items||[];
  const gross=items.reduce((s,i)=>s+i.price*i.qty,0);
  let disc=0;
  if(t.promo==="2x1"){
    const pz=[];items.filter(i=>i.cat==="Pizzas").forEach(i=>{for(let k=0;k<i.qty;k++)pz.push(i.price);});
    pz.sort((a,b)=>b-a);for(let k=1;k<pz.length;k+=2)disc+=pz[k];
  }else if(t.promo==="happy"){disc=Math.round(gross*.2);}
  else if(t.discVal){disc=t.discType==="amt"?Math.min(t.discVal,gross):Math.round(gross*t.discVal/100);}
  const fee=t.type==="delivery"?(t.dl?.fee||0):0;
  return{gross,disc,fee,net:gross-disc+fee};
}
const tabTotal=t=>calcTotals(t).net;

    h+=`</div><div class="fd-sec">Cerradas (últimas 5)</div><div class="fd-tbl">${th(cols,["ID","Hora inicio","Estado","Cliente","Total"])}`;
    h+=done.length?done.map(o=>`<div class="fd-tr closed ${o.id===selClosedId?"sel":""}" style="--cols:${cols}" onclick="selClosed(${o.id})"><b>${o.id}</b><span>${o.time}</span><span class="fd-ok">Cerrada</span><span>${esc(o.client||"")}</span><b class="r">${fmt(o.total)}</b></div>`).join(""):`<div class="fd-empty">Aún no hay pedidos cerrados hoy.</div>`;

    [["pending","Pendientes"],["prep","En preparación"],["route","En reparto"]].forEach(([k,l])=>{
      const list=openTabs.filter(t=>t.type==="delivery"&&(t.dlStatus||"pending")===k).sort((a,b)=>a.start-b.start);
      h+=`<div class="fd-sec ${k}">${l} ( ${list.length} )</div><div class="fd-tbl">${th(cols,heads)}`;
      h+=list.length?list.map(t=>`<div class="fd-tr dl ${t.id===selTabId?"sel":""}" style="--cols:${cols}" onclick="selTab(${t.id})"><b>${t.id}</b><span>${t.time}</span><span>${esc(addrStr(t.dl))}</span><span>${esc(t.dl?.phone||"")}</span><span>${esc(t.client)}</span><span>${esc(t.dl?.driver||"")}</span><span>${Math.floor((Date.now()-t.start)/60000)}m</span><b class="r">${fmt(tabTotal(t))}</b></div>`).join(""):`<div class="fd-empty">No hay pedidos.</div>`;

    h+=`</div>`;
  }

}

function setZone(z){mesaZone=z;renderFdLeft();}
function toggleEditMesas(){editMesasOn=!editMesasOn;renderFdLeft();}
function renderMesasLeft(el){
  const zones=[["salon","Salón"],["barra","Barra"]];
  const occOf=t=>openTabs.find(x=>x.type==="mesa"&&x.table===t.id);
  let h=`<div class="fd-bar"><div class="fd-ztabs">${zones.map(([k,l])=>`<button class="fd-ztab ${mesaZone===k?"on":""}" onclick="setZone('${k}')">${l}<i>${TABLES.filter(t=>t.zone===k&&occOf(t)).length}</i></button>`).join("")}</div>

  if(editMesasOn)h+=`<div class="fd-editbar"><b>Editar mapa · ${mesaZone==="salon"?"Salón":"Barra"}:</b>
    <button class="bs" style="font-size:12px;padding:5px 10px" onclick="addMesa('${mesaZone}','sq')">+ Cuadrada</button>

    <button class="bs" style="font-size:12px;padding:5px 10px" onclick="addMesa('${mesaZone}','circ')">+ Redonda</button>
    <span>Toca una mesa para renombrarla · ✕ para borrar</span></div>`;
  const sel=curTab();
  h+=`<div class="fd-mesas">`+TABLES.filter(t=>t.zone===mesaZone).map(t=>{
    const tb=occOf(t);
    return`<button class="fd-mesa ${t.shape==="rect"?"rect":t.shape==="circ"?"circ":""} ${tb?"occ":""} ${sel&&tb&&sel.id===tb.id||(formMode&&formMode.table===t.id)?"sel":""}" onclick="mesaClick(${t.id})">${esc(t.name)}${tb?`<small>${fmt(tabTotal(tb))}</small>`:""}${editMesasOn?`<span class="fd-mdel" onclick="event.stopPropagation();deleteMesa(${t.id})">✕</span>`:""}</button>`;
  }).join("")+`</div><div class="fd-legend"><span style="color:#2e9e62">● Libre</span><span style="color:#e08a00">● Ocupada</span></div>`;
  el.innerHTML=h;
  const q=$("mesa-q");
  q.oninput=()=>{mesaQuery=q.value;};
  q.onkeydown=e=>{if(e.key==="Enter")goMesaByName(q.value);};
}
function mesaClick(id){
  if(editMesasOn){
    const t=TABLES.find(x=>x.id===id);if(!t)return;
    const n=prompt("Nombre de la mesa:",t.name);
    if(n&&n.trim()){t.name=n.trim();saveTables();renderFdLeft();}
    return;
  }
  openMesa(id);
}
function openMesa(id){
  const tb=openTabs.find(x=>x.type==="mesa"&&x.table===id);
  selClosedId=null;
  if(tb){selTabId=tb.id;formMode=null;}
  else{selTabId=null;formMode={kind:"new",type:"mesa",table:id};}
  renderFd();
  if(tb)setTimeout(()=>$("fd-search")?.focus(),30);
  else setTimeout(()=>{const g=$("nf-guests");if(g){g.focus();g.select();}},30);
}
function goMesaByName(q){
  const n=nrm((q||"").trim());if(!n)return;
  const t=TABLES.find(x=>nrm(x.name)===n)||TABLES.find(x=>nrm(x.name).includes(n));
  if(!t){alert("No encontré esa mesa");return;}
  mesaZone=t.zone;mesaQuery="";openMesa(t.id);
}
function addMesa(zone,shape){
  const id=mesaIdCounter++;
  const nums=TABLES.filter(t=>t.zone===zone).map(t=>parseInt(String(t.name).replace(/\D/g,""))||0);
  const num=Math.max(0,...nums)+1;
  TABLES.push({id,zone,shape,x:20,y:20,name:zone==="barra"?`Barra ${num}`:`${num}`});
  saveTables();renderFdLeft();
}
function deleteMesa(id){
  if(openTabs.some(x=>x.type==="mesa"&&x.table===id)){alert("Mesa ocupada, ciérrala primero");return;}
  if(!confirm("¿Eliminar esta mesa?"))return;
  TABLES=TABLES.filter(t=>t.id!==id);saveTables();renderFdLeft();
}

function panelHtml(t){

function knownClients(){
  const m={};
  orders.filter(o=>o.type==="delivery").forEach(o=>{
    const d=o.dl||{name:o.dlName,phone:o.dlPhone||"",street:o.dlAddr||""};
    const k=(d.phone||d.name||"").toLowerCase();if(k)m[k]={...d,name:d.name||o.dlName||""};
  });
  openTabs.filter(t=>t.type==="delivery"&&t.dl).forEach(t=>{const k=(t.dl.phone||t.dl.name||"").toLowerCase();if(k)m[k]={...t.dl};});
  return Object.values(m);
}

     +row("Teléfono",`<input id="nf-phone" type="tel" placeholder="+56 9 ...">`)

     +row("Dirección *",`<input id="nf-street" placeholder="Calle"><div class="fdf-2"><input id="nf-num" placeholder="Número"><input id="nf-apt" placeholder="Piso / Depto"></div><input id="nf-barrio" placeholder="Barrio">`)

function bindForm(){

    s.oninput=()=>{

function fillClient(i){
  const c=sugList[i];if(!c)return;
  const set=(id,v)=>{const e=$(id);if(e)e.value=v||"";};
  set("nf-phone",c.phone);set("nf-name",c.name);set("nf-street",c.street);set("nf-num",c.num);set("nf-apt",c.apt);set("nf-barrio",c.barrio);

function createTab(){
  const f=formMode;if(!f)return;
  const g=id=>($(id)?.value||"").trim();
  const t={id:nextId(),type:f.type,items:[],start:Date.now(),time:ts(),date:td(),createdBy:currentUser?.name||"",waiter:g("nf-waiter")||currentUser?.name||"",comment:g("nf-comment"),client:g("nf-client")};
  if(f.type==="mesa"){t.table=f.table;t.guests=parseInt(g("nf-guests"))||2;}
  if(f.type==="delivery"){
    const dl={phone:g("nf-phone"),name:g("nf-name"),street:g("nf-street"),num:g("nf-num"),apt:g("nf-apt"),barrio:g("nf-barrio"),driver:g("nf-driver"),eta:parseInt(g("nf-eta"))||0,fee:parseInt(g("nf-fee"))||0};
    if(!dl.name||!dl.street){alert("Nombre y calle son obligatorios");return;}
    t.dl=dl;t.client=dl.name;t.dlStatus="pending";
  }
  orderCounter=t.id+1;
  saveTab(t);
  selTabId=t.id;formMode=null;selClosedId=null;staged[t.id]=[];
  renderFd();
  setTimeout(()=>$("fd-search")?.focus(),30);
}
function editTab(){
  const t=curTab();if(!t)return;
  const d=t.dl||{};
  const inp=(id,ph,v,type)=>`<input id="${id}" ${type?`type="${type}"`:""} placeholder="${ph}" value="${esc(v)}">`;
  let b="";
  if(t.type==="delivery")b=inp("et-name","Nombre",d.name)+inp("et-phone","Teléfono",d.phone)+inp("et-street","Calle",d.street)+inp("et-num","Número",d.num)+inp("et-apt","Piso / Depto",d.apt)+inp("et-barrio","Barrio",d.barrio)+inp("et-driver","Repartidor",d.driver)+inp("et-eta","Tiempo estimado (min)",d.eta||"","number")+inp("et-fee","Costo de envío",d.fee||"","number");
  else b=inp("et-client","Cliente",t.client)+(t.type==="mesa"?inp("et-guests","Comensales",t.guests||"","number"):"");
  b+=`<select id="et-waiter">${USERS.filter(u=>u.role!=="cocina").map(u=>`<option ${u.name===t.waiter?"selected":""}>${esc(u.name)}</option>`).join("")}</select><textarea id="et-comment" rows="2" placeholder="Comentario">${esc(t.comment)}</textarea>`;
  openModal("Editar pedido #"+t.id,b,()=>{
    const tt=curTab();if(!tt)return;
    const v=id=>($(id)?.value||"").trim();
    if(tt.type==="delivery"){tt.dl={phone:v("et-phone"),name:v("et-name")||d.name,street:v("et-street")||d.street,num:v("et-num"),apt:v("et-apt"),barrio:v("et-barrio"),driver:v("et-driver"),eta:parseInt(v("et-eta"))||0,fee:parseInt(v("et-fee"))||0};tt.client=tt.dl.name;}
    else{tt.client=v("et-client");if(tt.type==="mesa")tt.guests=parseInt(v("et-guests"))||tt.guests;}
    tt.waiter=v("et-waiter")||tt.waiter;tt.comment=v("et-comment");
    saveTab(tt);renderFd();
  });
}
function voidTab(){
  const t=curTab();if(!t)return;
  if(!(t.items||[]).length){
    if(confirm("¿Eliminar este pedido vacío?")){dropTab(t.id);selTabId=null;renderFd();}
    return;
  }
  if(currentUser?.role!=="admin"){alert("Solo el administrador puede anular pedidos con productos");return;}
  const r=prompt("Motivo de anulación (obligatorio):");
  if(!r||!r.trim())return;
  const T=calcTotals(t);
  pushOrder(clean({id:t.id,type:t.type,table:t.type==="mesa"?t.table:null,items:t.items.map(i=>({...i,finalPrice:i.price})),gross:T.gross+T.fee,disc:T.disc,total:T.net,tip:0,method:"",time:t.time,date:td(),hour:hr(),ts:Date.now(),status:"done",startTime:t.start,voided:true,voidReason:r.trim(),voidTime:ts(),createdBy:t.createdBy,client:t.client||""}));
  dropTab(t.id);selTabId=null;renderFd();
}

// ── AGREGAR PRODUCTOS ──
function searchItems(q){q=nrm((q||"").trim());if(!q)return[];return MENU.filter(i=>!i.out&&nrm(i.name).includes(q)).slice(0,8);}
function bindSearch(){
  const inp=$("fd-search");if(!inp)return;
  inp.oninput=showResults;
  inp.onkeydown=e=>{if(e.key==="Enter"){const r=searchItems(inp.value)[0];if(r){addStagedId(r.id);inp.value="";showResults();}}};
}
function showResults(){
  const inp=$("fd-search"),el=$("fd-results");if(!inp||!el)return;
  el.innerHTML=searchItems(inp.value).map(i=>`<button class="fd-res" onclick="pickRes(${i.id})"><span>${esc(i.name)}</span><b>${fmt(i.price)}</b></button>`).join("");
}
function pickRes(id){addStagedId(id);const inp=$("fd-search");if(inp){inp.value="";showResults();inp.focus();}}
function addStagedId(id){const it=MENU.find(x=>x.id===id);if(it)addStaged(it,1);}
function addStaged(item,qty){
  const t=curTab();if(!t||!item)return;
  const arr=staged[t.id]=staged[t.id]||[];
  const ex=arr.find(s=>s.id===item.id&&!s.note&&!s.chips.length&&s.price===item.price);
  if(ex)ex.qty+=qty;else arr.push({uid:uid(),id:item.id,cat:item.cat,name:item.name,price:item.price,qty,note:"",chips:[],open:false});
  renderStaged();
}
function stGet(u){const t=curTab();return t?(staged[t.id]||[]).find(s=>s.uid===u):null;}
function stQty(u,d){const s=stGet(u);if(!s)return;s.qty+=d;if(s.qty<=0)staged[selTabId]=staged[selTabId].filter(x=>x.uid!==u);renderStaged();}
function stPrice(u,v){const s=stGet(u);if(s){s.price=Math.max(0,parseInt(v)||0);renderStaged();}}
function stNoteToggle(u){const s=stGet(u);if(s){s.open=!s.open;renderStaged();}}
function stChip(u,n){const s=stGet(u);if(!s)return;s.chips=s.chips.includes(n)?s.chips.filter(x=>x!==n):[...s.chips,n];renderStaged();}
function stNote(u,v){const s=stGet(u);if(s)s.note=v;}
function stDel(u){staged[selTabId]=(staged[selTabId]||[]).filter(x=>x.uid!==u);renderStaged();}
function cancelStaged(){staged[selTabId]=[];renderStaged();}
function renderStaged(){
  const t=curTab(),el=$("fd-staged");if(!t||!el)return;
  const st=staged[t.id]||[];
  if(!st.length){el.innerHTML="";return;}
  const tot=st.reduce((s,i)=>s+i.price*i.qty,0);
  el.innerHTML=st.map(i=>`<div class="fds-row"><div class="fds-main">
      <div class="fds-qty"><button onclick="stQty('${i.uid}',-1)">−</button><span>${i.qty}</span><button onclick="stQty('${i.uid}',1)">+</button></div>
      <span class="fds-nm">${esc(i.name)}</span>
      <span class="fds-pr">$<input type="number" value="${i.price}" onchange="stPrice('${i.uid}',this.value)"></span>
      <button class="fds-ic ${i.note||i.chips.length?"on":""}" onclick="stNoteToggle('${i.uid}')" title="Nota">💬</button>
      <button class="fds-ic" onclick="stDel('${i.uid}')" title="Quitar">✕</button></div>
      ${i.open?`<div class="fds-note"><div class="cr-chips">${notesFor(MENU.find(x=>x.id===i.id)||i).map(n=>`<button class="chip ${i.chips.includes(n)?"on":""}" data-n="${esc(n)}" onclick="stChip('${i.uid}',this.dataset.n)">${esc(n)}</button>`).join("")}</div><textarea placeholder="Observación..." oninput="stNote('${i.uid}',this.value)">${esc(i.note)}</textarea></div>`:""}
    </div>`).join("")+`<div class="fds-tot">Total a confirmar: ${fmt(tot)}</div><div class="fds-btns"><button class="bs" onclick="cancelStaged()">Cancelar</button><button class="fd-btn or" style="padding:10px 22px" onclick="confirmStaged()">Confirmar</button></div>`;
}
function renderItems(){
  const t=curTab(),el=$("fd-items");if(!t||!el)return;
  el.innerHTML=(t.items||[]).map((i,ix)=>{const n=[...(i.chips||[]),i.note].filter(Boolean).join(", ");return`<div class="fdi-row"><span class="fdi-q">${i.qty}</span><span class="fdi-n">${esc(i.name)}${n?`<small>↳ ${esc(n)}</small>`:""}</span><span class="fdi-p">${fmt(i.price*i.qty)}</span><button class="fds-ic" onclick="delItem(${ix})" title="Quitar">✕</button></div>`;}).join("")||`<div class="fd-empty">Sin productos confirmados</div>`;
}
function renderFoot(){
  const t=curTab(),el=$("fd-foot");if(!t||!el)return;
  const T=calcTotals(t);
  const sub=(T.disc||T.fee)?`<div class="fdr-sub"><span>Subtotal ${fmt(T.gross)}${T.disc?` · Descuento -${fmt(T.disc)}`:""}${T.fee?` · Envío +${fmt(T.fee)}`:""}</span></div>`:"";
  el.innerHTML=`${sub}<div class="fdr-total"><span>Total:</span><b>${fmt(T.net)}</b></div>
    <div class="fdr-actions"><button class="bs" onclick="openDisc()">％ Descuento</button><button class="bs" onclick="openSplit()">➗ Dividir</button><button class="fd-btn dark" onclick="openCobrar()">Cerrar Pedido</button></div>`;
}
function delItem(ix){
  const t=curTab();if(!t)return;
  const it=t.items[ix];if(!it)return;
  if(!confirm(`¿Quitar ${it.qty}× ${it.name}? (ya fue enviado a cocina)`))return;
  t.items.splice(ix,1);saveTab(t);renderItems();renderFoot();renderFdLeft();
}
function confirmStaged(){
  const t=curTab();if(!t)return;
  const st=staged[t.id]||[];if(!st.length)return;
  const sent=st.map(s=>({uid:s.uid,id:s.id,cat:s.cat,name:s.name,price:s.price,qty:s.qty,note:s.note||"",chips:s.chips||[]}));
  t.items=[...(t.items||[]),...sent];
  staged[t.id]=[];
  saveTab(t);
  const tk={key:"k"+Date.now()+Math.random().toString(36).slice(2,5),tid:t.id,label:tabLabel(t),addr:t.type==="delivery"?addrStr(t.dl):"",items:sent,time:ts(),date:td(),startTime:Date.now(),status:"pending",createdBy:currentUser?.name||""};
  saveTicket(tk);
  renderFd();
  sendJob("cocina",tk);
}

// modal Adicionar
function openAddModal(){
  if(!curTab())return;
  addSel={};addCat=getCats()[0]||"";addQ="";$("fdm-q").value="";
  renderAddModal();$("add-ovl").classList.add("on");
}
function renderAddModal(){
  $("fdm-cats").innerHTML=getCats().map(c=>`<button class="fdm-cat ${c===addCat&&!addQ?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("fdm-cats").querySelectorAll(".fdm-cat").forEach(b=>b.onclick=()=>{addCat=b.dataset.c;addQ="";$("fdm-q").value="";renderAddModal();});
  const items=addQ?MENU.filter(i=>nrm(i.name).includes(nrm(addQ))):MENU.filter(i=>i.cat===addCat);
  $("fdm-list").innerHTML=items.map(i=>`<div class="fdm-row ${i.out?"out":""}" data-id="${i.id}"><span class="fdm-radio ${addSel[i.id]?"on":""}"></span><span style="flex:1">${esc(i.name)}${i.out?" · agotado":""}</span>${addSel[i.id]?`<span class="fdm-cnt" data-dec="1">${addSel[i.id]}</span>`:""}<b>${fmt(i.price)}</b></div>`).join("")||'<div class="fd-empty">Sin resultados</div>';
  $("fdm-list").querySelectorAll(".fdm-row").forEach(r=>r.onclick=e=>{
    const id=Number(r.dataset.id);
    if(e.target.closest("[data-dec]")){addSel[id]=(addSel[id]||1)-1;if(addSel[id]<=0)delete addSel[id];}
    else addSel[id]=(addSel[id]||0)+1;
    const sc=$("fdm-list").scrollTop;renderAddModal();$("fdm-list").scrollTop=sc;
  });
  const n=Object.values(addSel).reduce((s,v)=>s+v,0);
  $("fdm-ok").textContent=n?`Continuar (${n})`:"Continuar";
}
$("fdm-q").oninput=e=>{addQ=e.target.value.trim();renderAddModal();};
const closeAdd=()=>$("add-ovl").classList.remove("on");
$("fdm-x").onclick=closeAdd;$("fdm-cancel").onclick=closeAdd;
$("fdm-ok").onclick=()=>{
  Object.entries(addSel).forEach(([id,q])=>addStaged(MENU.find(x=>x.id===Number(id)),q));
  closeAdd();
};

function openDisc(){
  const t=curTab();if(!t)return;
  dcPromo=t.promo||null;
  openModal("Aplicar descuento",`<div class="promo-row"><button class="chip ${dcPromo==="2x1"?"on":""}" id="dc-2x1">🍕 2x1 Pizzas</button><button class="chip ${dcPromo==="happy"?"on":""}" id="dc-hp">🕐 Happy -20%</button></div>
    <div style="display:flex;gap:6px"><input id="dc-val" type="number" min="0" placeholder="Descuento" value="${t.promo?"":(t.discVal||"")}"><select id="dc-type" style="width:70px"><option value="pct" ${t.discType!=="amt"?"selected":""}>%</option><option value="amt" ${t.discType==="amt"?"selected":""}>$</option></select></div>`,()=>{
    const tt=curTab();if(!tt)return;
    tt.promo=dcPromo;tt.discVal=dcPromo?0:(parseFloat($("dc-val").value)||0);tt.discType=$("dc-type").value;
    saveTab(tt);renderFoot();renderFdLeft();
  });
  const sync=()=>{$("dc-2x1").classList.toggle("on",dcPromo==="2x1");$("dc-hp").classList.toggle("on",dcPromo==="happy");};
  $("dc-2x1").onclick=()=>{dcPromo=dcPromo==="2x1"?null:"2x1";$("dc-val").value="";sync();};
  $("dc-hp").onclick=()=>{dcPromo=dcPromo==="happy"?null:"happy";$("dc-val").value="";sync();};
  $("dc-val").oninput=()=>{dcPromo=null;sync();};
}

function updateSplit(){const n=Math.max(2,parseInt($("split-n").value)||2);const{net}=calcTotals();$("split-result").textContent=fmt(Math.ceil(net/n));}

function openCobrar(){
  const t=curTab();if(!t)return;
  if((staged[t.id]||[]).length){alert("Hay productos sin confirmar. Confirma o cancela antes de cerrar el pedido.");return;}
  if(!(t.items||[]).length){alert("El pedido no tiene productos");return;}
  payTip=0;payMethod="Efectivo";
  document.querySelectorAll("[data-tip]").forEach((x,i)=>x.classList.toggle("on",i===0));
  document.querySelectorAll("[data-pm]").forEach((x,i)=>x.classList.toggle("on",i===0));
  const T=calcTotals(t);
  $("pay-summary").innerHTML=`<span style="font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px">Total pedido #${t.id}</span><br><b>${fmt(T.net)}</b>`+(T.disc?`<div style="font-size:11px;color:var(--mt)">Descuento -${fmt(T.disc)}</div>`:"")+(T.fee?`<div style="font-size:11px;color:var(--mt)">Incluye envío ${fmt(T.fee)}</div>`:"");
  updatePayFinal();$("pay-ovl").classList.add("on");
}
document.querySelectorAll("[data-tip]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tip]").forEach(x=>x.classList.remove("on"));b.classList.add("on");payTip=parseInt(b.dataset.tip);updatePayFinal();});
document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-pm]").forEach(x=>x.classList.remove("on"));b.classList.add("on");payMethod=b.dataset.pm;});
function updatePayFinal(){const{net}=calcTotals();$("pay-final").textContent=fmt(net+Math.round(net*payTip/100));}
$("pay-cancel").onclick=()=>$("pay-ovl").classList.remove("on");
$("pay-ok").onclick=()=>{
  const t=curTab();if(!t)return;
  const T=calcTotals(t);
  const tip=Math.round(T.net*payTip/100);
  const o=clean({
    id:t.id,type:t.type,table:t.type==="mesa"?t.table:null,guests:t.type==="mesa"?(t.guests||null):null,
    client:t.client||"",waiter:t.waiter||"",comment:t.comment||"",
    dlName:t.type==="delivery"?(t.dl?.name||""):null,dlAddr:t.type==="delivery"?addrStr(t.dl):null,dlPhone:t.type==="delivery"?(t.dl?.phone||""):null,dl:t.type==="delivery"?t.dl:null,
    fee:T.fee,items:t.items.map(i=>({...i,chips:i.chips||[],finalPrice:i.price})),
    gross:T.gross+T.fee,disc:T.disc,total:T.net,tip,method:payMethod,promo:t.promo||null,
    time:t.time,closeTime:ts(),ts:Date.now(),date:t.date===td()?t.date:td(),hour:hr(),
    status:"done",startTime:t.start,voided:false,createdBy:t.createdBy||currentUser?.name||""
  });
  pushOrder(o);
  dropTab(t.id);selTabId=null;
  $("pay-ovl").classList.remove("on");
  renderFd();
  sendJob("recepcion",o);
};

// ══════════ ESTACIÓN DE IMPRESIÓN (impresión directa tipo Fudo) ══════════
// La PC del local (con Chrome en modo --kiosk-printing) imprime sola las comandas y recibos
// que se generan desde cualquier equipo (celulares incluidos).
const isStation=()=>{try{return localStorage.getItem("gp_station")==="1";}catch(e){return false;}};
const stationOnline=()=>Date.now()-stationTs<60000;
function flashToast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");setTimeout(()=>{t.classList.remove("on");t.textContent="🔔 Nuevo pedido entrante";},3000);}
function heartbeat(){if(isStation()&&dbReady&&window._db)window._set(window._ref(window._db,"station"),{ts:Date.now()});}
setInterval(heartbeat,15000);
function syncStationBtn(){
  const b=$("btn-station");if(!b)return;
  b.classList.toggle("on",isStation());
  b.title=isStation()?"Esta PC es la estación de impresión (clic para desactivar)":"Usar esta PC como estación de impresión";
}
$("btn-station").onclick=()=>{
  if(isStation()){try{localStorage.removeItem("gp_station");}catch(e){}syncStationBtn();flashToast("🖨 Estación de impresión desactivada");return;}
  if(!confirm("¿Usar ESTA PC como estación de impresión?\n\nImprimirá automáticamente las comandas de cocina y los recibos de todos los equipos. Úsalo solo en la PC conectada a la impresora."))return;
  try{localStorage.setItem("gp_station","1");}catch(e){}
  syncStationBtn();heartbeat();flashToast("🖨 Estación de impresión activada");
};
syncStationBtn();
function sendJob(kind,data){
  if(isStation()||!(dbReady&&window._db&&stationOnline())){
    // esta PC es la estación (imprime directo) o no hay estación en línea (se muestra la comanda como antes)
    if(isStation())queuePrint({kind,data});
    else if(kind==="cocina")showCocina(data);else showComanda(data,"recepcion");
    return;
  }
  const key="j"+Date.now()+Math.random().toString(36).slice(2,5);
  window._set(window._ref(window._db,"jobs/"+key),clean({key,kind,data,date:td(),ts:Date.now()}));
  flashToast("🖨 Enviado a la impresora");
}
function queuePrint(job){printQ.push(job);if(!printing)runPrint();}
function runPrint(){
  const job=printQ.shift();
  if(!job){printing=false;return;}
  printing=true;
  try{
    if(job.kind==="cocina"){showCocina(job.data);document.body.className="print-cocina";}
    else{showComanda(job.data,"recepcion");document.body.className="print-recepcion";}
  }catch(e){}
  setTimeout(()=>{
    try{window.print();}catch(e){}
    setTimeout(()=>{document.body.className="";$("comanda-ovl").classList.remove("on");runPrint();},800);
  },200);
}
function handleJobs(snap){
  if(!isStation())return;
  const d=snap.val();if(!d)return;
  Object.values(d).sort((a,b)=>a.ts-b.ts).forEach(j=>{
    window._remove(window._ref(window._db,"jobs/"+j.key));      // se toma el trabajo para no repetirlo
    if(j.date===td()&&Date.now()-j.ts<10*60*1000)queuePrint(j); // ignora trabajos viejos
  });
}

// ── KDS (tickets enviados con "Confirmar") ──
function renderKDS(){
  const grid=document.getElementById("kds-grid");
  const active=tickets.filter(k=>k.status!=="done"&&k.date===td());
  if(!active.length){grid.innerHTML='<div style="color:var(--mt);text-align:center;padding:50px;font-size:14px;grid-column:1/-1">🎉 Sin pedidos pendientes</div>';updateKDSBadge();return;}
  grid.innerHTML="";
  active.sort((a,b)=>a.startTime-b.startTime).forEach(k=>{
    const el=Math.floor((Date.now()-k.startTime)/60000);
    const tc=el>=15?"late":el>=8?"warn":"";
    const card=document.createElement("div");
    card.className=`kds-card ${k.status}`;
    card.innerHTML=`
      <div class="kds-top">
        <div>
          <div class="kds-id">#${String(k.tid).padStart(3,"0")} ${esc(k.label)}</div>
          <div class="kds-type">${k.time}${k.createdBy?` · ${esc(k.createdBy)}`:""}</div>
        </div>
        <span class="kds-timer ${tc}">${el}min</span>
      </div>
      <div class="kds-items">${k.items.map(i=>{const n=[...(i.chips||[]),i.note].filter(Boolean).join(", ");return`<div>· ${i.qty}× ${esc(i.name)}</div>${n?`<div class="kds-note">▶ ${esc(n)}</div>`:""}`}).join("")}</div>
      <div class="kds-actions">
        ${k.status==="pending"?`<button style="background:#e8f4fc;color:var(--blue)" data-a="prep" data-k="${k.key}">▶ Preparando</button>`:""}
        ${k.status==="prep"?`<button style="background:#eafaf1;color:var(--green)" data-a="ready" data-k="${k.key}">✓ Listo</button>`:""}
        ${k.status==="ready"?`<button style="background:#f0f2f5;color:var(--mt)" data-a="done" data-k="${k.key}">✓ Entregado</button>`:""}
      </div>`;
    card.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      const kk=tickets.find(x=>x.key===b.dataset.k);
      if(kk){kk.status=b.dataset.a;saveTicket(kk);}
      renderKDS();updateKDSBadge();
    });
    grid.appendChild(card);
  });
  updateKDSBadge();
}
setInterval(()=>{if(activeTab==="kds")renderKDS();},30000);

const PAY_METHODS=["Efectivo","Tarjeta","Transferencia"];
const TYPE_LBL={mostrador:"Mostrador",mesa:"Mesas",delivery:"Delivery"};
let movs=[],cajas=[];
const VF={period:"hoy",from:"",to:"",turno:"",estado:"",tipo:"",cliente:"",pago:"",mesa:"",sel:null,sort:"time"};
const RF={period:"7",from:"",to:"",cat:"",turno:"",top:10,mesa:"ventas"};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function odate(o){
  const m=String(o.date||"").match(/(\d+)\D+(\d+)\D+(\d+)/);
  if(!m)return null;
  let a=+m[1],b=+m[2],c=+m[3];
  if(a>1000)return new Date(a,b-1,c);
  return new Date(c,b-1,a);
}
function periodRange(p,from,to){
  const n=new Date();n.setHours(0,0,0,0);
  let a=new Date(n),b=new Date(n);
  if(p==="ayer"){a.setDate(a.getDate()-1);b=new Date(a);}
  else if(p==="7")a.setDate(a.getDate()-6);
  else if(p==="30")a.setDate(a.getDate()-29);
  else if(p==="mes")a.setDate(1);
  else if(p==="mespas"){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),0);}
  else if(p==="rango"){a=from?new Date(from+"T00:00"):new Date(n);b=to?new Date(to+"T00:00"):new Date(a);}
  if(b<a)b=new Date(a);
  return[a,b];
}
function prevRange(a,b){
  const len=Math.round((b-a)/864e5)+1;
  const pb=new Date(a);pb.setDate(pb.getDate()-1);
  const pa=new Date(pb);pa.setDate(pa.getDate()-(len-1));
  return[pa,pb];
}
function ordersIn(a,b){
  return orders.filter(o=>{const d=odate(o);return d&&d>=a&&d<=b;});
}
const valid=l=>l.filter(o=>!o.voided);
const turnoOf=o=>(o.hour??0)<17?"Almuerzo":"Cena";
const waiterOf=o=>o.waiter||o.createdBy||"—";
const sum=(l,f)=>l.reduce((s,o)=>s+(typeof f==="function"?f(o):(o[f]||0)),0);
const pad3=id=>String(id).padStart(3,"0");
const PERIODS=[["hoy","Hoy"],["ayer","Ayer"],["7","Últimos 7 días"],["30","Últimos 30 días"],["mes","Este mes"],["mespas","Mes pasado"],["rango","Rango"]];
function periodSel(st,fn,withRange=true){
  return`<label class="vf-f"><span>Período</span><select onchange="${fn}('period',this.value)">${PERIODS.map(([v,l])=>`<option value="${v}" ${st.period===v?"selected":""}>${l}</option>`).join("")}</select></label>`+
  (st.period==="rango"?`<label class="vf-f"><span>Desde</span><input type="date" value="${st.from}" onchange="${fn}('from',this.value)"></label><label class="vf-f"><span>Hasta</span><input type="date" value="${st.to}" onchange="${fn}('to',this.value)"></label>`:"");
}
function pctDelta(cur,prev){
  if(!prev)return cur?`<span class="rp-d up">nuevo</span>`:`<span class="rp-d">—</span>`;
  const p=(cur-prev)/prev*100;
  return`<span class="rp-d ${p>=0?"up":"dn"}">${p>=0?"▲":"▼"} ${Math.abs(p).toFixed(1).replace(".",",")}% vs. período anterior</span>`;
}
function dateLbl(d){return d.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit"});}
function persist(path,obj){
  if(dbReady&&window._db)window._set(window._ref(window._db,path),clean(obj));
}
function fbOrderUpdate(o,patch){
  Object.assign(o,patch);
  if(dbReady&&window._db&&o._k)window._update(window._ref(window._db,"orders/"+o._k),clean(patch));
}
function exportCSV(name,rows){
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name+".csv";a.click();
}

// ═════════ HISTORIAL ═════════
function vfSet(k,v){VF[k]=v;if(k!=="sel")VF.sel=null;renderVentas();}
function histOrders(){
  const[a,b]=periodRange(VF.period,VF.from,VF.to);
  let l=ordersIn(a,b);
  if(VF.estado==="Eliminada")l=l.filter(o=>o.voided);
  else if(VF.estado==="Cerrada")l=l.filter(o=>!o.voided);
  if(VF.turno)l=l.filter(o=>turnoOf(o)===VF.turno);
  if(VF.tipo)l=l.filter(o=>o.type===VF.tipo);
  if(VF.pago)l=l.filter(o=>o.method===VF.pago);
  if(VF.mesa)l=l.filter(o=>o.type==="mesa"&&String(o.table)===VF.mesa);
  if(VF.cliente){const q=nrm(VF.cliente);l=l.filter(o=>nrm((o.client||"")+" "+(o.dlName||"")).includes(q));}
  return l.sort((x,y)=>(y.ts||0)-(x.ts||0)||(+y.id||0)-(+x.id||0));
}

function cajaStats(c){
  const end=c.closedTs||Date.now();
  const ords=valid(orders).filter(o=>(o.ts||0)>=c.openTs&&(o.ts||0)<=end);
  const mv=movs.filter(m=>m.ts>=c.openTs&&m.ts<=end&&m.method==="Efectivo");
  const ventas=sum(ords,"total"),cash=sum(ords.filter(o=>o.method==="Efectivo"),o=>o.total+(o.tip||0));
  const ing=sum(mv.filter(m=>m.type==="ingreso"),"amount"),egr=sum(mv.filter(m=>m.type==="egreso"),"amount");
  return{ords,ventas,cash,ing,egr,expected:(c.initial||0)+cash+ing-egr,byPay:PAY_METHODS.map(p=>[p,sum(ords.filter(o=>o.method===p),o=>o.total+(o.tip||0)),ords.filter(o=>o.method===p).length])};
}

function repVentas(){
  const[a,b]=periodRange(RF.period,RF.from,RF.to),[pa,pb]=prevRange(a,b);
  const all=ordersIn(a,b),ok=valid(all),prev=valid(ordersIn(pa,pb));
  const bruto=sum(ok,"gross"),neto=sum(ok,"total"),desc=sum(ok,"disc"),n=ok.length;
  const pBr=sum(prev,"gross"),pNe=sum(prev,"total"),pDe=sum(prev,"disc");
  const card=(l,v,c,p)=>`<div class="rp-card"><span>${l}</span><b>${v}</b>${pctDelta(c,p)}</div>`;
  // evolución por día
  const days=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))days.push(new Date(d));
  const byDay=days.map(d=>{const l=ok.filter(o=>odate(o).getTime()===d.getTime());return{l:dateLbl(d),v:sum(l,"total"),n:l.length};});
  const showDays=byDay.length>31?byDay.slice(-31):byDay;
  // día de la semana
  const DW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const dw=DW.map((l,i)=>({l,v:sum(ok.filter(o=>((odate(o).getDay()+6)%7)===i),"total")}));
  // hora
  const hrs=[];for(let h=11;h<=23;h++)hrs.push({l:h+"h",v:sum(ok.filter(o=>o.hour===h),"total"),c:"#ff7a50"});
  const pay=PAY_METHODS.map(p=>({l:p,v:sum(ok.filter(o=>o.method===p),o=>o.total+(o.tip||0))})).filter(x=>x.v);
  const orig=Object.entries(TYPE_LBL).map(([k,l])=>({l,v:sum(ok.filter(o=>o.type===k),"total")})).filter(x=>x.v);
  const gar={};ok.forEach(o=>{const w=waiterOf(o);if(!gar[w])gar[w]={n:0,q:0,v:0};gar[w].n++;gar[w].q+=sum(o.items||[],"qty");gar[w].v+=o.total;});
  const canc=all.filter(o=>o.voided);
  const cg={};canc.forEach(o=>{const w=waiterOf(o);if(!cg[w])cg[w]={q:0,v:0};cg[w].q+=sum(o.items||[],"qty");cg[w].v+=o.total;});
  const mot={};canc.forEach(o=>{const m=o.voidReason||"Sin motivo";mot[m]=(mot[m]||0)+o.total;});
  return repHead()+`
  <div class="rp-cards">
   ${card("Total ventas brutas",fmt(bruto),bruto,pBr)}
   ${card("Total ventas netas",fmt(neto),neto,pNe)}
   ${card("Descuentos",fmt(desc),desc,pDe)}
   ${card("Cantidad de ventas",n,n,prev.length)}
   ${card("Promedio por venta",n?fmt(neto/n):"$0",n?neto/n:0,prev.length?pNe/prev.length:0)}
   <div class="rp-card"><span>Propinas</span><b>${fmt(sum(ok,"tip"))}</b></div>
  </div>
  <div class="card"><div class="rp-t">Evolución de ventas</div><div class="rp-s">${a.toLocaleDateString("es-CL")} – ${b.toLocaleDateString("es-CL")}</div>${vBars(showDays,{h:140})}<div class="rp-s" style="margin-top:6px">Ventas por día (neto)${byDay.length>31?" · últimos 31 días":""}</div></div>
  <div class="rp-g2"><div class="card"><div class="rp-t">Ventas por día de la semana</div>${vBars(dw,{color:"#1b4a85"})}</div>
  <div class="card"><div class="rp-t">Ventas por hora</div>${vBars(hrs)}</div></div>
  <div class="rp-g3"><div class="card"><div class="rp-t">Medios de pago</div>${hBars(pay)}</div>
  <div class="card"><div class="rp-t">Origen de las ventas</div>${hBars(orig)}</div>
  <div class="card"><div class="rp-t">Turnos</div>${hBars([{l:"Almuerzo",v:sum(ok.filter(o=>turnoOf(o)==="Almuerzo"),"total")},{l:"Cena",v:sum(ok.filter(o=>turnoOf(o)==="Cena"),"total")}].filter(x=>x.v))}</div></div>
  <div class="card"><div class="rp-t">Ranking de garzones / cajeros</div>${rankTable(Object.entries(gar).sort((x,y)=>y[1].v-x[1].v).map(([u,d],i)=>[i+1,u,d.q,fmt(d.v)]),["Pos.","Usuario","Cant. de productos","Ventas ($)"])}</div>
  <div class="card"><div class="rp-t">Histórico de cancelaciones</div>${rankTable(Object.entries(cg).sort((x,y)=>y[1].v-x[1].v).map(([u,d],i)=>[i+1,u,d.q,fmt(d.v)]),["Pos.","Usuario","Cant. de productos","Monto ($)"])}</div>
  <div class="card"><div class="rp-t">Distribución de cancelaciones por motivo</div>${hBars(Object.entries(mot).map(([l,v])=>({l,v})).sort((x,y)=>y.v-x.v))}</div>`;
}
function rankTable(rows,hdr){
  if(!rows.length)return'<div class="rp-empty">Sin datos</div>';
  return`<div class="pg-th" style="grid-template-columns:50px 2fr 1fr 1fr">${hdr.map(h=>`<span>${h}</span>`).join("")}</div>`+rows.map(r=>`<div class="pg-tr" style="grid-template-columns:50px 2fr 1fr 1fr">${r.map(c=>`<span>${esc(String(c))}</span>`).join("")}</div>`).join("");
}
// ═════════ REPORTES: PRODUCTOS ═════════
function prodAgg(ok){
  const ps={};
  ok.forEach(o=>(o.items||[]).forEach(i=>{const p=ps[i.name]||(ps[i.name]={name:i.name,cat:i.cat||MENU.find(m=>m.id===i.id)?.cat||"—",qty:0,total:0});p.qty+=i.qty;p.total+=(i.finalPrice??i.price)*i.qty;}));
  return Object.values(ps);
}
function repProductos(){
  const[a,b]=periodRange(RF.period,RF.from,RF.to),[pa,pb]=prevRange(a,b);
  let ok=valid(ordersIn(a,b)),prev=valid(ordersIn(pa,pb));
  if(RF.turno){ok=ok.filter(o=>turnoOf(o)===RF.turno);prev=prev.filter(o=>turnoOf(o)===RF.turno);}
  let ps=prodAgg(ok);const pp=prodAgg(prev);
  if(RF.cat){ps=ps.filter(p=>p.cat===RF.cat);}
  const q=sum(ps,"qty"),pq=RF.cat?sum(pp.filter(p=>p.cat===RF.cat),"qty"):sum(pp,"qty");
  const totRev=sum(ps,"total")||1;
  ps.sort((x,y)=>y.qty-x.qty);
  const top3=sum(ps.slice(0,3),"total");
  const top=ps.slice(0,RF.top);
  const cats=[...new Set(MENU.map(m=>m.cat))];
  const catAgg=cats.map(c=>({l:c,v:sum(prodAgg(ok).filter(p=>p.cat===c),"total")})).filter(x=>x.v).sort((x,y)=>y.v-x.v);
  return repHead(`<label class="vf-f"><span>Categoría</span><select onchange="rfSet('cat',this.value)"><option value="">Todas</option>${cats.map(c=>`<option ${RF.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
   <label class="vf-f"><span>Turno</span><select onchange="rfSet('turno',this.value)"><option value="">Todos</option><option ${RF.turno==="Almuerzo"?"selected":""}>Almuerzo</option><option ${RF.turno==="Cena"?"selected":""}>Cena</option></select></label>
   <label class="vf-f"><span>Cantidad</span><select onchange="rfSet('top',+this.value)">${[10,20,50,500].map(n=>`<option value="${n}" ${RF.top===n?"selected":""}>${n===500?"Todos":"Top "+n}</option>`).join("")}</select></label>`)+`
  <div class="rp-cards">
   <div class="rp-card"><span>Total de productos vendidos</span><b>${q}</b>${pctDelta(q,pq)}</div>
   <div class="rp-card"><span>Top 3 por ventas</span><b>${(top3/totRev*100).toFixed(0)}%</b><span class="rp-d">de los ingresos totales</span></div>
   <div class="rp-card"><span>Productos distintos</span><b>${ps.length}</b></div>
  </div>
  <div class="card"><div class="rp-t">Productos por cantidad de ventas</div>
   ${top.length?`<div class="pg-th" style="grid-template-columns:2fr 1fr 1fr 1fr 80px"><span>Producto</span><span>Categoría</span><span>Cantidad</span><span>Venta ($)</span><span>Venta (%)</span></div>`+top.map(p=>`<div class="pg-tr" style="grid-template-columns:2fr 1fr 1fr 1fr 80px"><b>${esc(p.name)}</b><span>${esc(p.cat)}</span><span>${p.qty}</span><span>${fmt(p.total)}</span><span>${(p.total/totRev*100).toFixed(1).replace(".",",")}%</span></div>`).join(""):'<div class="rp-empty">Sin datos. Modifica los filtros para ver otros resultados.</div>'}</div>
  <div class="card"><div class="rp-t">Ventas por categoría</div>${hBars(catAgg)}</div>
  <div class="card"><div class="rp-t">Menos vendidos</div>${ps.length?[...ps].reverse().slice(0,10).map(p=>`<div class="pg-tr" style="grid-template-columns:2fr 1fr 1fr"><b>${esc(p.name)}</b><span>${p.qty} und</span><span>${fmt(p.total)}</span></div>`).join(""):'<div class="rp-empty">Sin datos</div>'}</div>`;
}
// ═════════ REPORTES: MESAS ═════════
function repMesas(){
  const[a,b]=periodRange(RF.period,RF.from,RF.to);
  let ok=valid(ordersIn(a,b)).filter(o=>o.type==="mesa");
  const g={};
  ok.forEach(o=>{const n=TABLES.find(t=>t.id===o.table)?.name||("Mesa "+o.table);if(!g[n])g[n]={n:0,v:0,p:0,tip:0};g[n].n++;g[n].v+=o.total;g[n].p+=o.guests||0;g[n].tip+=o.tip||0;});
  const rows=Object.entries(g).sort((x,y)=>y[1].v-x[1].v);
  const hrs=[];for(let h=11;h<=23;h++)hrs.push({l:h+"h",v:sum(ok.filter(o=>o.hour===h),"total"),c:"#1b4a85"});
  return repHead()+`
  <div class="rp-cards"><div class="rp-card"><span>Ventas en mesas</span><b>${ok.length}</b></div><div class="rp-card"><span>Total</span><b>${fmt(sum(ok,"total"))}</b></div><div class="rp-card"><span>Personas</span><b>${sum(ok,o=>o.guests||0)||"—"}</b></div><div class="rp-card"><span>Promedio por persona</span><b>${sum(ok,o=>o.guests||0)?fmt(sum(ok,"total")/sum(ok,o=>o.guests||0)):"—"}</b></div></div>
  <div class="card"><div class="rp-t">Ventas por mesa y hora</div>${ok.length?vBars(hrs):'<div class="rp-empty">Sin datos. Modifica los filtros para ver otros resultados.</div>'}</div>
  <div class="card"><div class="rp-t">Ventas por mesa</div>${rows.length?`<div class="pg-th" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr"><span>Mesa</span><span>Ventas</span><span>Total</span><span>Promedio</span><span>Personas</span></div>`+rows.map(([n,d])=>`<div class="pg-tr" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr"><b>${esc(n)}</b><span>${d.n}</span><span>${fmt(d.v)}</span><span>${fmt(d.v/d.n)}</span><span>${d.p||"—"}</span></div>`).join(""):'<div class="rp-empty">Sin datos</div>'}</div>`;
}
function exportReport(){
  const[a,b]=periodRange(RF.period,RF.from,RF.to);
  if(activeTab==="rep-productos"){
    exportCSV("reporte-productos",[["Producto","Categoría","Cantidad","Venta"],...prodAgg(valid(ordersIn(a,b))).sort((x,y)=>y.qty-x.qty).map(p=>[p.name,p.cat,p.qty,p.total])]);
  }else{
    const days=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))days.push(new Date(d));
    const ok=valid(ordersIn(a,b));
    exportCSV("reporte-ventas",[["Fecha","Ventas","Brutas","Descuentos","Netas","Propinas"],...days.map(d=>{const l=ok.filter(o=>odate(o).getTime()===d.getTime());return[d.toLocaleDateString("es-CL"),l.length,sum(l,"gross"),sum(l,"disc"),sum(l,"total"),sum(l,"tip")];})]);
  }
}

// ── VOID ──
let voidTarget=null;
function openVoid(id){voidTarget=id;document.getElementById("void-reason").value="";document.getElementById("void-ovl").classList.add("on");}
document.getElementById("void-cancel").onclick=()=>document.getElementById("void-ovl").classList.remove("on");
document.getElementById("void-ok").onclick=()=>{
  const r=document.getElementById("void-reason").value.trim();if(!r){alert("Indica el motivo");return;}
  const o=orders.find(x=>String(x.id)===String(voidTarget)&&!x.voided);
  if(o){fbOrderUpdate(o,{voided:true,voidReason:r,voidTime:ts()});}
  document.getElementById("void-ovl").classList.remove("on");renderVentas();
};

// ── PRODUCTOS ──
let prodCatFilter="";
function renderProductos(){
  const hoy=todayOrders();
  const ps={};
  MENU.forEach(m=>{ps[m.name]={qty:0,total:0,cat:m.cat,price:m.price};});
  hoy.forEach(o=>o.items.forEach(i=>{if(!ps[i.name])ps[i.name]={qty:0,total:0,cat:i.cat,price:i.finalPrice};ps[i.name].qty+=i.qty;ps[i.name].total+=i.finalPrice*i.qty;}));
  // cat list
  const cats=getCats();
  const catEl=document.getElementById("prod-cat-list");
  catEl.innerHTML=`<button class="pcat ${!prodCatFilter?"on":""}" data-c="">Todos</button>`+cats.map(c=>`<button class="pcat ${prodCatFilter===c?"on":""}" data-c="${c}">${c}</button>`).join("");
  catEl.querySelectorAll(".pcat").forEach(b=>b.onclick=()=>{prodCatFilter=b.dataset.c;if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();});
  const sortBy=document.getElementById("prod-sort")?.value||"qty";
  let list=Object.entries(ps);
  if(prodCatFilter)list=list.filter(([,d])=>d.cat===prodCatFilter);
  const q=document.getElementById("prod-search")?.value||"";
  if(q)list=list.filter(([n])=>n.toLowerCase().includes(q.toLowerCase()));
  list.sort((a,b)=>sortBy==="qty"?b[1].qty-a[1].qty:b[1].total-a[1].total);
  const table=document.getElementById("prod-table");
  if(!list.length){table.innerHTML='<div style="color:var(--mt);padding:20px">Sin productos</div>';return;}
  table.innerHTML=list.map(([n,d],i)=>`
    <div class="prod-row">
      <div>
        <div style="font-weight:500">${n}</div>
        <div style="font-size:11px;color:var(--mt)">${d.cat}</div>
        <div style="background:#f0f2f5;border-radius:3px;height:3px;margin-top:4px;max-width:200px"><div style="background:var(--acc);height:100%;border-radius:3px;width:${Math.round(d[sortBy]/list[0][1][sortBy]*100)}%"></div></div>
      </div>
      <div class="col-cost" style="text-align:right;font-weight:600;color:var(--acc)">${fmt(d.price)}</div>
      <div class="col-margin" style="text-align:right;color:var(--mt)">${d.qty} und</div>
      <div class="col-markup" style="text-align:right;font-weight:600">${fmt(d.total)}</div>
      <div style="text-align:right;display:flex;gap:4px;justify-content:flex-end">
        <button class="bs" style="font-size:11px;padding:3px 7px" onclick="editProduct(${MENU.find(x=>x.name===n)?.id})">✏️</button>
        <button class="${MENU.find(x=>x.name===n)?.out?"bg2":"bs"}" style="font-size:11px;padding:3px 7px;${!MENU.find(x=>x.name===n)?.out?"color:var(--red)":""}" onclick="toggleOut(${MENU.find(x=>x.name===n)?.id})">${MENU.find(x=>x.name===n)?.out?"✓":"✕"}</button>
      </div>
    </div>`).join("");
}
const _rp=()=>{if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();};
document.getElementById("prod-search")?.addEventListener("input",_rp);
document.getElementById("prod-sort")?.addEventListener("change",_rp);

// ── MENU EDITOR ──
function renderMenuEditor(){
  const el=document.getElementById("prod-table");
  const catEl=document.getElementById("prod-cat-list");
  catEl.innerHTML=`<button class="pcat ${!prodCatFilter?"on":""}" data-c="">Todos</button>`+getCats().map(c=>`<button class="pcat ${prodCatFilter===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  catEl.querySelectorAll(".pcat").forEach(b=>b.onclick=()=>{prodCatFilter=b.dataset.c;renderMenuEditor();});
  const q=nrm(document.getElementById("prod-search")?.value||"");
  const MENU_V=MENU.filter(i=>(!prodCatFilter||i.cat===prodCatFilter)&&(!q||nrm(i.name).includes(q)));
  if(!MENU_V.length){el.innerHTML='<div style="color:var(--mt);padding:20px">Sin productos</div>';return;}
  el.innerHTML=[...new Set(MENU_V.map(i=>i.cat))].map(cat=>`
    <div style="font-size:11px;font-weight:700;color:var(--mt);padding:8px 12px 3px;text-transform:uppercase;letter-spacing:.5px">${cat}</div>
    ${MENU_V.filter(i=>i.cat===cat).map(i=>`
      <div class="me-row" style="padding:8px 12px">
        <button class="bs" style="padding:2px 6px;font-size:12px" onclick="toggleFav(${i.id})">${i.fav?"⭐":"☆"}</button>
        <span class="me-name" style="${i.out?"color:var(--mt);text-decoration:line-through":""}">${i.name}</span>
        <span class="me-price">${fmt(i.price)}</span>
        <button class="bs" style="font-size:11px;padding:3px 7px" onclick="editProduct(${i.id})">Editar</button>
        <button class="${i.out?"bg2":"bs"}" style="font-size:11px;padding:3px 7px;${!i.out?"color:var(--red)":""}" onclick="toggleOut(${i.id})">${i.out?"Activar":"Agotado"}</button>
        <button class="bs" style="font-size:11px;padding:3px 7px;color:var(--red)" onclick="deleteProduct(${i.id})">✕</button>
      </div>`).join("")}`).join("");
}
function saveMenu(){if(dbReady&&window._db)window._set(window._ref(window._db,"config/menu"),clean({items:MENU,counter:menuIdCounter,ts:Date.now()}));}
function toggleFav(id){const i=MENU.find(x=>x.id===id);if(i)i.fav=!i.fav;saveMenu();if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();}
function toggleOut(id){const i=MENU.find(x=>x.id===id);if(i)i.out=!i.out;saveMenu();if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();buildCatBar();renderMenuGrid();}
function deleteProduct(id){if(confirm("¿Eliminar producto?")){MENU=MENU.filter(x=>x.id!==id);saveMenu();}if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();buildCatBar();renderMenuGrid();}
let modalCb=null;
function openModal(t,b,cb){document.getElementById("modal-title").textContent=t;document.getElementById("modal-body").innerHTML=b;modalCb=cb;document.getElementById("modal").classList.add("on");}
document.getElementById("modal-cancel").onclick=()=>document.getElementById("modal").classList.remove("on");
document.getElementById("modal-ok").onclick=()=>{if(modalCb&&modalCb()===false)return;document.getElementById("modal").classList.remove("on");};
function editProduct(id){
  if(!id)return;
  const i=MENU.find(x=>x.id===id);if(!i)return;
  openModal("Editar producto",`<input id="mp-name" value="${i.name}" placeholder="Nombre"><input id="mp-price" type="number" value="${i.price}" placeholder="Precio"><input id="mp-cat" value="${i.cat}" placeholder="Categoría"><input id="mp-notes" value="${esc(notesFor(i).join(', '))}" placeholder="Sugerencias rápidas (separadas por coma)">`,()=>{
    i.name=document.getElementById("mp-name").value||i.name;
    i.price=parseInt(document.getElementById("mp-price").value)||i.price;
    i.cat=document.getElementById("mp-cat").value||i.cat;
    i.notes=document.getElementById("mp-notes").value.split(",").map(s=>s.trim()).filter(Boolean);saveMenu();
    if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();buildCatBar();renderMenuGrid();
  });
}
document.getElementById("btn-new-prod").onclick=()=>{
  openModal("Nuevo producto",`<input id="mp-name" placeholder="Nombre"><input id="mp-price" type="number" placeholder="Precio"><input id="mp-cat" placeholder="Categoría">`,()=>{
    const n=document.getElementById("mp-name").value,p=parseInt(document.getElementById("mp-price").value),c=document.getElementById("mp-cat").value;
    if(!n||!p||!c)return;
    MENU.push({id:menuIdCounter++,cat:c,name:n,price:p,out:false,fav:false});saveMenu();
    if(activeTab==="menu-edit")renderMenuEditor();else renderProductos();buildCatBar();renderMenuGrid();
  });
};

// ── USUARIOS ──
function renderUsers(){
  document.getElementById("users-list").innerHTML=USERS.map(u=>`
    <div class="user-card">
      <div class="u-avatar">${u.avatar}</div>
      <div style="flex:1"><div class="u-name">${u.name}</div><div class="u-role">${ROLES[u.role]}</div><div style="font-size:11px;color:var(--mt)">PIN: ${"●".repeat(u.pin.length)}</div></div>
      <button class="bs" style="font-size:11px;padding:4px 8px" onclick="editUser('${u.id}')">Editar</button>
      ${u.id!==currentUser?.id?`<button class="bs" style="font-size:11px;padding:4px 8px;color:var(--red)" onclick="deleteUser('${u.id}')">✕</button>`:""}
    </div>`).join("");
}
document.getElementById("btn-new-user").onclick=()=>{
  openModal("Nuevo usuario",`<input id="u-name" placeholder="Nombre"><input id="u-avatar" placeholder="Inicial (ej: A)" maxlength="2"><select id="u-role"><option value="admin">Administrador</option><option value="caja">Cajero</option><option value="cocina">Cocina</option></select><input id="u-pin" type="password" placeholder="PIN 4 dígitos" maxlength="4">`,()=>{
    const n=document.getElementById("u-name").value.trim(),pin=document.getElementById("u-pin").value;
    if(!n||pin.length!==4){alert("Nombre y PIN de 4 dígitos requeridos");return;}
    USERS.push({id:"u"+Date.now(),name:n,role:document.getElementById("u-role").value,pin,avatar:document.getElementById("u-avatar").value||n[0].toUpperCase()});
    renderUsers();renderLoginUsers();
  });
};
function editUser(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  openModal("Editar usuario",`<input id="u-name" value="${u.name}"><select id="u-role"><option value="admin"${u.role==="admin"?" selected":""}>Administrador</option><option value="caja"${u.role==="caja"?" selected":""}>Cajero</option><option value="cocina"${u.role==="cocina"?" selected":""}>Cocina</option></select><input id="u-pin" type="password" placeholder="Nuevo PIN (vacío = sin cambio)" maxlength="4">`,()=>{
    u.name=document.getElementById("u-name").value||u.name;
    u.role=document.getElementById("u-role").value;
    const np=document.getElementById("u-pin").value;if(np&&np.length===4)u.pin=np;
    renderUsers();renderLoginUsers();
  });
}
function deleteUser(id){if(USERS.length<=1){alert("Debe haber al menos un usuario");return;}if(confirm("¿Eliminar?"))USERS=USERS.filter(x=>x.id!==id);renderUsers();renderLoginUsers();}

if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
